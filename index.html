<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPEKAT Koperasi - Risk Analytics</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
        * { font-family: 'DM Sans', sans-serif; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4,0,0.2,1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .glass-panel { background: rgba(15, 12, 41, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
        .glass-light { background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.6); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .gradient-accent { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .gradient-risk-green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .gradient-risk-yellow { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
        .gradient-risk-red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .gradient-risk-critical { background: linear-gradient(135deg, #111827 0%, #000000 100%); }
        
        .card-hover { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.15); }
        .tab-active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
        
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%); background-size: 200% 100%; animation: skeletonLoading 1.5s infinite; border-radius: 8px; }
        @keyframes skeletonLoading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
 </head>
 <body class="min-h-screen text-white antialiased" style="background: linear-gradient(180deg, #0f0c29 0%, #1a1a3e 40%, #24243e 100%); background-attachment: fixed;">
  <div id="root"></div>
  
  <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // URL WEB APP ANDA - GANTI JIKA ADA DEPLOYMENT BARU
        const GOOGLE_SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbynBkr_S1uZ4zbkJnJ1p9UU8rPAZ38AchBU3s9PEWZ6PoidQbXdYo-Dyh4oOH3CSDKcfg/exec';

        // Constants for Risk Matrix
        const RISK_LEVELS = {
            GREEN: { id: 'GREEN', label: 'Lancar', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30', icon: 'fa-shield-check' },
            YELLOW: { id: 'YELLOW', label: 'Warning', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30', icon: 'fa-triangle-exclamation' },
            RED: { id: 'RED', label: 'Bermasalah', color: 'bg-rose-500/20 text-rose-400 border-rose-500/30', icon: 'fa-fire' },
            CRITICAL: { id: 'CRITICAL', label: 'Macet/Kritis', color: 'bg-slate-800/80 text-red-500 border-red-500/50 font-bold', icon: 'fa-skull-crossbones' }
        };

        const MemberTrendChart = ({ history }) => {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            React.useEffect(() => {
                if (history && history.length > 0 && chartRef.current && window.Chart) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                    
                    const sortedHistory = [...history].sort((a,b) => String(a.periode || '').localeCompare(String(b.periode || '')));

                    const labels = sortedHistory.map(h => {
                        if(!h.periode) return '-';
                        const [y, m] = h.periode.split('-');
                        const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
                        return `${bln[parseInt(m)-1]} ${y.substring(2)}`;
                    });

                    const dataTunggakan = sortedHistory.map(h => Number(h.sisa_pending) || 0);
                    const dataOutstanding = sortedHistory.map(h => Number(h.sisa_outstanding) || 0);
                    
                    const ctx = chartRef.current.getContext('2d');
                    
                    chartInstance.current = new window.Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                { 
                                    label: 'Tunggakan (Risk)', 
                                    data: dataTunggakan, 
                                    borderColor: '#f43f5e', 
                                    backgroundColor: 'rgba(244, 63, 94, 0.2)', 
                                    tension: 0.3, 
                                    pointRadius: 4, 
                                    borderWidth: 3,
                                    fill: true
                                },
                                { 
                                    label: 'Sisa Hutang Pokok', 
                                    data: dataOutstanding, 
                                    borderColor: '#3b82f6', 
                                    backgroundColor: 'transparent', 
                                    tension: 0.3, 
                                    pointRadius: 4, 
                                    borderWidth: 2,
                                    borderDash: [5, 5]
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { labels: { color: 'rgba(255, 255, 255, 0.7)', font: { family: 'DM Sans', size: 12 } }, position: 'top' },
                                tooltip: { 
                                    backgroundColor: 'rgba(15, 12, 41, 0.9)', 
                                    titleColor: '#fff', 
                                    bodyColor: '#fff', 
                                    borderColor: 'rgba(255,255,255,0.2)', 
                                    borderWidth: 1, 
                                    padding: 10, 
                                    cornerRadius: 8,
                                    callbacks: {
                                        label: function(context) {
                                            let label = context.dataset.label || '';
                                            if (label) {
                                                label += ': ';
                                            }
                                            if (context.parsed.y !== null) {
                                                label += new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(context.parsed.y);
                                            }
                                            return label;
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: 'rgba(255, 255, 255, 0.5)' } },
                                y: { 
                                    grid: { color: 'rgba(255, 255, 255, 0.1)' }, 
                                    ticks: { 
                                        color: 'rgba(255, 255, 255, 0.5)',
                                        callback: function(value) {
                                            if (value >= 1000000) return (value / 1000000) + ' Jt';
                                            return value;
                                        }
                                    } 
                                }
                            }
                        }
                    });
                }
                
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                        chartInstance.current = null;
                    }
                };
            }, [history]);

            return (
                <div className="h-[250px] w-full relative">
                    <canvas ref={chartRef}></canvas>
                    {!window.Chart && <div className="absolute inset-0 flex items-center justify-center text-white/30 text-sm"><i className="fa-solid fa-spinner animate-spin mr-2"></i> Memuat grafik...</div>}
                </div>
            );
        };

        function App() {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const [loans, setLoans] = useState([]);
            const [writeoffs, setWriteoffs] = useState([]);
            
            // STATE BARU: Untuk menyimpan raw data dan filter bulan
            const [rawReports, setRawReports] = useState([]);
            const [availablePeriods, setAvailablePeriods] = useState([]);
            const [selectedPeriod, setSelectedPeriod] = useState('ALL');
            const [riskTrendData, setRiskTrendData] = useState([]);

            const [activeTab, setActiveTab] = useState('analytics');
            const [loading, setLoading] = useState(true);
            const [isRefreshing, setIsRefreshing] = useState(false);
            
            const [toast, setToast] = useState({ msg: null, type: 'info' });
            const toastTimerRef = useRef(null);
            
            // Modals
            const [detailModal, setDetailModal] = useState({ open: false, member: null });
            const [kunjunganModal, setKunjunganModal] = useState({ open: false, loan: null });
            const [pengajuanModal, setPengajuanModal] = useState({ open: false });
            const [riskModal, setRiskModal] = useState({ open: false, level: null });
            const [guideModal, setGuideModal] = useState(false);

            const exportToCSV = (data, filename) => {
                if (data.length === 0) return;
                const headers = ["NRP", "Nama", "Site", "Target Potongan", "Berhasil Debet", "Sisa Outstanding", "Tunggakan (Pending)", "DPD", "Keterangan"];
                const csvRows = [headers.join(',')];
                
                data.forEach(row => {
                    const values = [
                        `"${row.nik || ''}"`,
                        `"${row.nama || ''}"`,
                        `"${row.site || ''}"`,
                        row.targetPotongan || 0,
                        row.berhasilDebet || 0,
                        row.sisaOutstanding || 0,
                        row.sisaPending || 0,
                        row.dpd || 0,
                        `"${row.latestReport?.keterangan || ''}"`
                    ];
                    csvRows.push(values.join(','));
                });
                
                const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('hidden', '');
                a.setAttribute('href', url);
                a.setAttribute('download', filename + '.csv');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            // HELPER BARU: Mengubah format tanggal ISO menjadi format bulan yang rapi (Bulan Tahun)
            const formatBulan = (val) => {
                if (!val) return "-";
                try {
                    const date = new Date(val);
                    if (!isNaN(date.getTime())) {
                        return date.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
                    }
                    return val;
                } catch(e) { return val; }
            };
            
            const showToast = (msg, type = 'info') => { 
                setToast({ msg, type }); 
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = setTimeout(() => setToast({ msg: null, type: 'info' }), 4000); 
            };

            const fetchData = async () => {
                setIsRefreshing(true);
                try {
                    // Fetch Laporan Data First (The source of truth)
                    const resL = await fetch(`${GOOGLE_SHEETS_API_URL}?action=getLaporan&_t=${new Date().getTime()}`);
                    if (!resL.ok) throw new Error(`Gagal menghubungi server Google. Status: ${resL.status}`);
                    const dL = await resL.json(); 
                    
                    // SAFETY CHECK
                    if (dL.status === 'error') throw new Error(dL.message);
                    
                    let currentReports = [];
                    if (dL.data && Array.isArray(dL.data) && dL.data.length > 0) {
                        currentReports = dL.data;
                    }
                    
                    // Simpan raw data
                    setRawReports(currentReports);
                    
                    // Ekstrak list periode unik untuk Dropdown UI
                    const periods = [...new Set(currentReports.map(r => r.periode).filter(Boolean))].sort().reverse();
                    setAvailablePeriods(periods);
                    
                    // Fetch Writeoffs
                    const resW = await fetch(`${GOOGLE_SHEETS_API_URL}?action=getWriteoffs&_t=${new Date().getTime()}`);
                    if (resW.ok) {
                        const dW = await resW.json(); 
                        if (dW.data && Array.isArray(dW.data)) setWriteoffs(dW.data);
                    }
                    
                } catch (e) { 
                    showToast(`Data Error: ${e.message}`, "error"); 
                } finally { 
                    setLoading(false); 
                    setIsRefreshing(false); 
                }
            };

            const calculateRiskForPeriod = (reports, period) => {
                const memberMap = new Map();
                
                reports.forEach(rep => {
                    const nrp = rep?.nrp;
                    if(!nrp) return; 

                    // Abaikan data dari masa depan jika mensimulasikan bulan lampau
                    if (period !== 'ALL' && rep.periode > period) return;

                    if(!memberMap.has(nrp)) {
                        memberMap.set(nrp, {
                            id: rep.id || `temp-${Math.random()}`,
                            nama: rep.nama || 'Tanpa Nama',
                            nik: nrp,
                            site: rep.site || '-',
                            totalPinjamanAwal: 0,
                            history: []
                        });
                    }
                    const member = memberMap.get(nrp);
                    member.history.push(rep);
                    
                    const repJumlah = Number(rep.jumlah) || 0;
                    if(repJumlah > member.totalPinjamanAwal) member.totalPinjamanAwal = repJumlah;
                });

                return Array.from(memberMap.values()).map(member => {
                    member.history.sort((a,b) => String(a.periode || '').localeCompare(String(b.periode || '')));
                    
                    const latest = member.history[member.history.length - 1];
                    const previous = member.history.length > 1 ? member.history[member.history.length - 2] : null;

                    const sisaOutstanding = Number(latest?.sisa_outstanding) || 0;
                    const sisaPending = Number(latest?.sisa_pending) || 0;
                    const targetPotongan = Number(latest?.total_potongan) || 0;
                    const berhasilDebet = Number(latest?.berhasil_debet) || 0;

                    let dpd = 0;
                    if (sisaPending > 0 && latest?.tgl_jatuh_tempo) {
                        const dueDate = new Date(latest.tgl_jatuh_tempo);
                        const actDate = latest.tgl_bayar ? new Date(latest.tgl_bayar) : new Date(); 
                        const diffTime = actDate - dueDate;
                        if(diffTime > 0) {
                            dpd = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        }
                    }

                    const lateFreq = member.history.filter(h => {
                        const pending = Number(h?.sisa_pending) || 0;
                        const target = Number(h?.total_potongan) || 0;
                        const debet = Number(h?.berhasil_debet) || 0;
                        return pending > 0 || (target > 0 && debet < target);
                    }).length;

                    let warnings = [];
                    if (previous) {
                        const prevPending = Number(previous?.sisa_pending) || 0;
                        if (prevPending === 0 && sisaPending > 0) warnings.push("Mundur Potongan (Gagal Baru)");
                    }
                    if (member.totalPinjamanAwal > 0) {
                        const ratio = (sisaOutstanding / member.totalPinjamanAwal) * 100;
                        if (ratio > 80 && sisaOutstanding > 100000) warnings.push(`Debt Ratio Tinggi (${ratio.toFixed(0)}%)`);
                    }
                    if(targetPotongan > 0 && berhasilDebet > 0 && berhasilDebet < targetPotongan && lateFreq > 1){
                         warnings.push("Konsisten Bayar Parsial");
                    }

                    let riskLevel = RISK_LEVELS.GREEN;
                    const statusKet = (latest?.keterangan || '').toLowerCase();
                    
                    if (dpd > 60 || statusKet.includes('gagal total') || lateFreq >= 4 || statusKet.includes('macet')) {
                        riskLevel = RISK_LEVELS.CRITICAL;
                    } else if (dpd > 30 || lateFreq >= 2 || sisaPending >= (targetPotongan * 2)) {
                        riskLevel = RISK_LEVELS.RED;
                    } else if (dpd > 0 || lateFreq === 1 || sisaPending > 0) {
                        riskLevel = RISK_LEVELS.YELLOW;
                    }

                    return {
                        ...member,
                        latestReport: latest,
                        sisaOutstanding,
                        sisaPending,
                        targetPotongan,
                        berhasilDebet,
                        dpd,
                        lateFreq,
                        warnings,
                        riskLevel
                    };
                });
            };

            // EFEK BARU: Terpicu secara instan saat raw data berubah atau user mengganti filter bulan
            useEffect(() => {
                if (!rawReports || rawReports.length === 0) {
                    setLoans([]);
                    setRiskTrendData([]);
                    return;
                }

                // Kalkulasi data tren historis (dari bulan terlama ke terbaru)
                // Kita mengurutkan availablePeriods secara kronologis (ascending)
                const chronologicalPeriods = [...availablePeriods].sort();
                const trendData = chronologicalPeriods.map(period => {
                    const members = calculateRiskForPeriod(rawReports, period);
                    // Filter members yang memang laporannya ada di bulan tersebut
                    const activeMembers = members.filter(m => m.latestReport?.periode === period);
                    
                    return {
                        name: formatBulan(period),
                        periodCode: period,
                        Green: activeMembers.filter(m => m.riskLevel.id === 'GREEN').length,
                        Yellow: activeMembers.filter(m => m.riskLevel.id === 'YELLOW').length,
                        Red: activeMembers.filter(m => m.riskLevel.id === 'RED').length,
                        Critical: activeMembers.filter(m => m.riskLevel.id === 'CRITICAL').length
                    };
                });
                setRiskTrendData(trendData);

                // Kalkulasi anggota untuk tabel (periode aktif)
                const processedMembers = calculateRiskForPeriod(rawReports, selectedPeriod);
                
                // FILTER PENAMPILAN: Hanya tampilkan anggota yang memang ada laporannya di bulan tersebut
                let finalLoans = processedMembers;
                if (selectedPeriod !== 'ALL') {
                    finalLoans = processedMembers.filter(m => m.latestReport?.periode === selectedPeriod);
                }
                
                // Set Loans (Pemantauan), sort by highest risk (Critical/Red first, then DPD)
                setLoans(finalLoans.sort((a,b) => {
                    const score = (r) => r==='CRITICAL'?4:r==='RED'?3:r==='YELLOW'?2:1;
                    if(score(b.riskLevel.id) !== score(a.riskLevel.id)) return score(b.riskLevel.id) - score(a.riskLevel.id);
                    return b.dpd - a.dpd;
                })); 
            }, [rawReports, selectedPeriod]);

            // Efek untuk me-render Chart.js
            useEffect(() => {
                if (riskTrendData.length > 0 && chartRef.current && window.Chart) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                    
                    const ctx = chartRef.current.getContext('2d');
                    
                    chartInstance.current = new window.Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: riskTrendData.map(d => d.name),
                            datasets: [
                                { label: 'Lancar', data: riskTrendData.map(d => d.Green), borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.3, pointRadius: 4, borderWidth: 3 },
                                { label: 'Warning', data: riskTrendData.map(d => d.Yellow), borderColor: '#fbbf24', backgroundColor: '#fbbf24', tension: 0.3, pointRadius: 4, borderWidth: 3 },
                                { label: 'Bermasalah', data: riskTrendData.map(d => d.Red), borderColor: '#f43f5e', backgroundColor: '#f43f5e', tension: 0.3, pointRadius: 4, borderWidth: 3 },
                                { label: 'Macet / Kritis', data: riskTrendData.map(d => d.Critical), borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.3, pointRadius: 4, borderWidth: 3, borderDash: [5, 5] },
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { labels: { color: 'rgba(255, 255, 255, 0.7)', font: { family: 'DM Sans', size: 12 } }, position: 'bottom' },
                                tooltip: { backgroundColor: 'rgba(15, 12, 41, 0.9)', titleColor: '#fff', bodyColor: '#fff', borderColor: 'rgba(255,255,255,0.2)', borderWidth: 1, padding: 10, cornerRadius: 8 }
                            },
                            scales: {
                                x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: 'rgba(255, 255, 255, 0.5)' } },
                                y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: 'rgba(255, 255, 255, 0.5)', stepSize: 1 } }
                            }
                        }
                    });
                }
                
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                        chartInstance.current = null;
                    }
                };
            }, [riskTrendData]);

            useEffect(() => { fetchData(); }, []);

            const handleSimpanLaporan = async (e) => {
                e.preventDefault(); 
                const fd = new FormData(e.target); 
                const p = new URLSearchParams(); 
                p.append('action','addLaporan');
                for(let[k,v] of fd.entries()) p.append(k,v);
                
                setIsRefreshing(true);
                try { 
                    const r = await fetch(GOOGLE_SHEETS_API_URL,{method:'POST',body:p}); 
                    if (!r.ok) throw new Error("Gagal terhubung ke Google Script");
                    const res = await r.json(); 
                    if(res.status === 'success') {
                        e.target.reset();
                        showToast("Data berhasil direkam. Algoritma sedang dikalkulasi...", "success");
                        setActiveTab('analytics'); // Pindah ke dashboard agar user lihat hasilnya
                        fetchData(); // Muat ulang re-kalkulasi scoring
                    } else {
                        showToast(`Server: ${res.message}`, "error");
                    }
                } catch(e) { showToast(`Gagal menyimpan data: ${e.message}`, "error"); } 
                finally { setIsRefreshing(false); }
            };

            const handleAjukanKasus = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target); 
                const loanId = fd.get('loanId');
                
                const sel = loans.find(l => String(l.id) === String(loanId));
                if (!sel) return showToast("Pilih anggota yang valid", "warning");
                
                const p = new URLSearchParams();
                p.append('action','addWriteoff'); p.append('loanId',sel.id); p.append('nama',sel.nama); 
                p.append('nik',sel.nik); p.append('sisaHutang',sel.sisaOutstanding); p.append('alasan',fd.get('alasan'));
                
                setIsRefreshing(true);
                try { 
                    const r = await fetch(GOOGLE_SHEETS_API_URL,{method:'POST',body:p}); 
                    const res = await r.json(); 
                    if (res.status === 'success') {
                        setPengajuanModal({open:false});
                        showToast("Kasus berhasil diekskalasi ke Penyelesaian", "success");
                        fetchData();
                    }
                } catch(e) { showToast("Error jaringan", "error"); } 
                finally { setIsRefreshing(false); }
            };

            // Menghitung Analytics Summary secara aman
            const totalTargetPotongan = loans.reduce((s, l) => s + (l.targetPotongan || 0), 0);
            const totalBerhasilDebet = loans.reduce((s, l) => s + (l.berhasilDebet || 0), 0);
            const collectionRate = totalTargetPotongan > 0 ? (totalBerhasilDebet / totalTargetPotongan) * 100 : 0;

            const aging = {
                current: loans.filter(l => l.dpd === 0 && l.sisaPending > 0).reduce((s, l) => s + (l.sisaPending || 0), 0),
                days30: loans.filter(l => l.dpd > 0 && l.dpd <= 30).reduce((s, l) => s + (l.sisaPending || 0), 0),
                days60: loans.filter(l => l.dpd > 30 && l.dpd <= 60).reduce((s, l) => s + (l.sisaPending || 0), 0),
                days90Plus: loans.filter(l => l.dpd > 60).reduce((s, l) => s + (l.sisaPending || 0), 0),
            };

            const par30 = loans.filter(l => l.dpd > 30).reduce((s, l) => s + (l.sisaOutstanding || 0), 0);

            // Group by Site
            const siteRisk = {};
            loans.forEach(l => {
                const siteName = l.site || 'Unknown';
                if (!siteRisk[siteName]) siteRisk[siteName] = { count: 0, pending: 0, criticalRed: 0 };
                siteRisk[siteName].count++;
                siteRisk[siteName].pending += (l.sisaPending || 0);

                                                    <tr><th className="p-3">Periode</th><th className="p-3">Jatuh Tempo</th><th className="p-3 text-right">Target Potong</th><th className="p-3 text-right">Berhasil Debet</th><th className="p-3 text-right">Pending/Tunggakan</th><th className="p-3">Status</th></tr>
                                                </thead>
                                                <tbody className="divide-y divide-white/10">
                                                    {[...detailModal.member.history].reverse().map((h, i) => {
                                                        const pending = Number(h?.sisa_pending) || 0;
                                                        const debet = Number(h?.berhasil_debet) || 0;
                                                        const target = Number(h?.total_potongan) || 0;
                                                        const isDefaulter = pending > 0 || (target > 0 && debet < target);
                                                        
                                                        return (
                                                            <tr key={i} className="bg-white/[0.02] hover:bg-white/[0.05]">
                                                                <td className="p-3 font-bold text-white/80">{formatBulan(h?.periode)}</td>
                                                                <td className="p-3 text-white/60">{h?.tgl_jatuh_tempo ? new Date(h.tgl_jatuh_tempo).toLocaleDateString('id-ID') : '-'}</td>
                                                                <td className="p-3 text-right text-white/70">Rp {target.toLocaleString('id-ID')}</td>
                                                                <td className={`p-3 text-right font-bold ${debet >= target && target > 0 ? 'text-emerald-400' : (debet > 0 ? 'text-amber-400' : 'text-rose-400')}`}>Rp {debet.toLocaleString('id-ID')}</td>
                                                                <td className="p-3 text-right font-bold text-rose-400">Rp {pending.toLocaleString('id-ID')}</td>
                                                                <td className="p-3">
                                                                    <div className="flex flex-col gap-1 items-start">
                                                                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${isDefaulter?'bg-rose-500/20 text-rose-300':'bg-emerald-500/20 text-emerald-300'}`}>{h?.keterangan || (isDefaulter?'Bermasalah':'Lancar')}</span>
                                                                        {h?.alasan_telat && <span className="text-[9px] text-white/40 italic">{h.alasan_telat}</span>}
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Pengajuan Kasus Modal */}
                        {pengajuanModal.open && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
                                <div className="glass-panel border border-white/10 rounded-2xl shadow-2xl w-[calc(100vw-2rem)] md:w-full md:max-w-md p-6 overflow-hidden">
                                    <h3 className="text-xl font-bold text-white mb-2">Formulir Eskalasi</h3>
                                    <p className="text-sm text-white/50 mb-5">Tarik debitur dengan status RED atau CRITICAL ke tab Penyelesaian.</p>
                                    <form onSubmit={handleAjukanKasus}>
                                        <div className="mb-4">
                                            <label className="block text-xs font-bold text-white/50 mb-1.5 uppercase">Pilih Debitur Bermasalah</label>
                                            <select name="loanId" required className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none text-white focus:border-purple-500">
                                                <option value="" className="bg-slate-900">-- Pilih Debitur --</option>
                                                {loans.filter(l=>l.riskLevel.id==='CRITICAL' || l.riskLevel.id==='RED').map(l=><option key={l.id} value={l.id} className="bg-slate-900">{l.nama} (Risk: {l.riskLevel.id})</option>)}
                                            </select>
                                        </div>
                                        <div className="mb-6">
                                            <label className="block text-xs font-bold text-white/50 mb-1.5 uppercase">Alasan Eskalasi Utama</label>
                                            <select name="alasan" required className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none text-white focus:border-purple-500">
                                                <option value="" className="bg-slate-900">-- Pilih Alasan --</option>
                                                <option value="Macet Total > 3 Bulan" className="bg-slate-900">Macet Total &gt; 3 Bulan</option>
                                                <option value="PHK Menunggak" className="bg-slate-900">Resign / PHK Menunggak</option>
                                                <option value="Klaim Asuransi (Meninggal/Cacat)" className="bg-slate-900">Klaim Asuransi (Meninggal/Cacat)</option>
                                                <option value="Tindakan Hukum / Somasi" className="bg-slate-900">Proses Somasi / Legal</option>
                                            </select>
                                        </div>
                                        <div className="flex justify-end gap-3 pt-4 border-t border-white/10">
                                            <button type="button" onClick={()=>setPengajuanModal({open:false})} className="px-5 py-2.5 text-white/50 hover:text-white hover:bg-white/5 rounded-xl font-medium transition-colors">Batal</button>
                                            <button type="submit" disabled={isRefreshing} className="px-6 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl shadow-lg transition-colors">{isRefreshing?'Processing...':'Ekskalasi Kasus'}</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Risk Modal (Export Excel/CSV) */}
                        {riskModal.open && riskModal.level && RISK_LEVELS[riskModal.level] && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in overflow-y-auto py-10">
                                <div className="glass-panel border border-white/10 rounded-2xl shadow-2xl w-[calc(100vw-2rem)] md:w-full md:max-w-5xl flex flex-col max-h-[90vh] overflow-hidden">
                                    <div className="px-4 md:px-6 py-4 md:py-5 border-b border-white/10 flex justify-between items-start md:items-center sticky top-0 bg-[#16162e] z-10 gap-2">
                                        <div>
                                            <h3 className="text-lg md:text-xl font-bold text-white flex items-center gap-2 md:gap-3">
                                                Daftar Debitur: <span className={`px-2 py-1 rounded text-xs border ${RISK_LEVELS[riskModal.level].color}`}>{riskModal.level}</span>
                                            </h3>
                                            <p className="text-xs md:text-sm text-white/50 mt-1">Total {loans.filter(l => l.riskLevel.id === riskModal.level).length} anggota dalam kategori ini.</p>
                                        </div>
                                        <div className="flex flex-col md:flex-row gap-2">
                                            <button onClick={() => exportToCSV(loans.filter(l => l.riskLevel.id === riskModal.level), `Data_Debitur_${riskModal.level}`)} className="px-3 md:px-4 py-2 rounded-xl text-xs md:text-sm font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition-colors flex items-center justify-center gap-2">
                                                <i className="fa-solid fa-file-excel"></i> <span className="hidden md:inline">Download Excel (CSV)</span><span className="md:hidden">CSV</span>
                                            </button>
                                            <button onClick={()=>setRiskModal({open:false, level:null})} className="w-8 h-8 md:w-10 md:h-10 shrink-0 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-white/60 hover:text-white transition-colors"><i className="fa-solid fa-xmark text-sm md:text-lg"></i></button>
                                        </div>
                                    </div>
                                    
                                    <div className="p-4 md:p-6 overflow-y-auto">
                                        <div className="border border-white/10 rounded-xl overflow-x-auto">
                                            <table className="w-full text-left text-sm whitespace-nowrap">
                                                <thead className="bg-black/40 text-white/50 text-[11px] uppercase tracking-wider">
                                                    <tr>
                                                        <th className="p-3">Nama / NIK</th>
                                                        <th className="p-3">Site</th>
                                                        <th className="p-3 text-right">Target Potong</th>
                                                        <th className="p-3 text-right">Berhasil Debet</th>
                                                        <th className="p-3 text-right text-rose-300">Tunggakan (Pending)</th>
                                                        <th className="p-3 text-center">DPD</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-white/10">
                                                    {loans.filter(l => l.riskLevel.id === riskModal.level).length === 0 ? (
                                                        <tr><td colSpan="6" className="p-6 text-center text-white/40">Tidak ada data untuk kategori ini.</td></tr>
                                                    ) : loans.filter(l => l.riskLevel.id === riskModal.level).map(l => (
                                                        <tr key={l.id} className="bg-white/[0.02] hover:bg-white/[0.05]">
                                                            <td className="p-3">
                                                                <div className="font-bold text-white/90">{l.nama}</div>
                                                                <div className="text-[10px] text-white/40">{l.nik}</div>
                                                            </td>
                                                            <td className="p-3 text-white/70">{l.site}</td>
                                                            <td className="p-3 text-right text-white/70">Rp {l.targetPotongan.toLocaleString('id-ID')}</td>
                                                            <td className="p-3 text-right text-emerald-300 font-medium">Rp {l.berhasilDebet.toLocaleString('id-ID')}</td>
                                                            <td className="p-3 text-right text-rose-400 font-bold">Rp {l.sisaPending.toLocaleString('id-ID')}</td>
                                                            <td className="p-3 text-center">
                                                                {l.dpd > 0 ? <span className="bg-rose-500/20 text-rose-300 px-2 py-1 rounded text-[10px] font-bold">{l.dpd} Hr</span> : <span className="text-white/40">-</span>}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                    </main>

                    {/* MODAL PANDUAN KPI */}
                    {guideModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setGuideModal(false)}></div>
                            <div className="glass-panel border border-white/20 rounded-2xl w-[calc(100vw-2rem)] md:w-full md:max-w-2xl max-h-[85vh] flex flex-col relative z-10 overflow-hidden shadow-2xl scale-100 transition-all fade-in">
                                <div className="p-4 md:p-5 border-b border-white/10 flex justify-between items-start md:items-center bg-white/5">
                                    <h3 className="text-lg md:text-xl font-bold text-white flex items-center gap-2 md:gap-3">
                                        <div className="w-8 h-8 rounded-full bg-purple-500/20 text-purple-400 flex items-center justify-center shrink-0"><i className="fa-solid fa-book-open"></i></div>
                                        Panduan Indikator Kinerja (KPI)
                                    </h3>
                                    <button onClick={() => setGuideModal(false)} className="w-8 h-8 shrink-0 flex items-center justify-center rounded-full hover:bg-white/10 text-white/50 hover:text-white transition-colors"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <div className="p-4 md:p-6 overflow-y-auto custom-scrollbar space-y-6 text-xs md:text-sm text-white/80">
                                    
                                    <div>
                                        <h4 className="font-bold text-white text-lg mb-3 border-b border-white/10 pb-2">1. Kategori Risiko</h4>
                                        <div className="space-y-4">
                                            <div className="flex gap-4">
                                                <div className="w-10 h-10 shrink-0 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center border border-amber-500/30"><i className="fa-solid fa-triangle-exclamation"></i></div>
                                                <div>
                                                    <div className="font-bold text-amber-400 mb-1">YELLOW (Warning / Peringatan Awal)</div>
                                                    <p>Anggota ini baru pertama kali telat bayar (frekuensi telat = 1) atau baru memiliki sedikit tunggakan sisa. Ini adalah lampu kuning agar pengurus mulai melakukan konfirmasi ringan.</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-4">
                                                <div className="w-10 h-10 shrink-0 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center border border-rose-500/30"><i className="fa-solid fa-fire"></i></div>
                                                <div>
                                                    <div className="font-bold text-rose-400 mb-1">RED (Bermasalah)</div>
                                                    <p>Anggota ini sudah menunggak setidaknya 2 bulan berturut-turut, atau nominal tunggakannya sudah sangat besar (setara 2x lipat dari target cicilannya). Butuh penagihan intensif.</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-4">
                                                <div className="w-10 h-10 shrink-0 rounded-xl bg-slate-800 text-red-500 flex items-center justify-center border border-red-500/50"><i className="fa-solid fa-skull-crossbones"></i></div>
                                                <div>
                                                    <div className="font-bold text-red-500 mb-1">CRITICAL (Macet / Kritis)</div>
                                                    <p>Risiko tertinggi! Anggota ini sudah menunggak sangat lama (di atas 4 bulan/60 hari) atau berstatus "gagal total/macet". Harus segera disidangkan atau diajukan penyelesaian khusus (Write-off).</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <h4 className="font-bold text-white text-lg mb-3 border-b border-white/10 pb-2">2. Metrik Keuangan & Peringatan</h4>
                                        <ul className="space-y-3">
                                            <li>
                                                <strong className="text-rose-300">Total Tunggakan:</strong> Jumlah uang cicilan yang <b>sudah lewat jatuh tempo</b> (tertunggak) di bulan tersebut, namun belum dibayar oleh anggota. Ini adalah uang tunai macet yang seharusnya sudah masuk ke kas koperasi.
                                            </li>
                                            <li>
                                                <strong className="text-blue-300">Exposure Outstanding:</strong> Berbeda dengan tunggakan, ini adalah <b>total SISA SELURUH HUTANG</b> dari orang-orang yang bermasalah. Ini menunjukkan <i>Maximum Risk</i> atau potensi kerugian total jika orang tersebut kabur atau di-PHK.
                                            </li>
                                            <li>
                                                <strong className="text-amber-300">Early Warning:</strong> Angka yang menunjukkan jumlah kasus yang memicu "Alarm Pintar" dari algoritma sistem. Alarm ini mendeteksi anomali seperti anggota yang tiba-tiba gagal debet, rasio sisa hutangnya masih terlalu tinggi (&gt;80%), atau sering membayar cicilan dengan nominal parsial (tidak penuh).
                                            </li>
                                        </ul>
                                    </div>

                                    <div className="bg-blue-500/10 border border-blue-500/20 p-4 rounded-xl text-blue-200 text-xs">
                                        <i className="fa-solid fa-circle-info mr-2"></i><b>Catatan:</b> Indikator <b>GREEN (Lancar)</b> sengaja disembunyikan dari dashboard karena data mentah saat ini berfokus secara eksklusif pada debitur yang bermasalah atau gagal bayar.
                                    </div>
                                </div>
                                <div className="p-5 border-t border-white/10 bg-black/20 text-right">
                                    <button onClick={() => setGuideModal(false)} className="px-5 py-2.5 bg-white/10 hover:bg-white/20 text-white rounded-xl font-bold transition-colors">Tutup Panduan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
