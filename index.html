        const MemberTrendChart = ({ history }) => {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            React.useEffect(() => {
                if (history && history.length > 0 && chartRef.current && window.Chart) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    
                    const sortedHistory = [...history].sort((a,b) => String(a.periode || '').localeCompare(String(b.periode || '')));
                    const labels = sortedHistory.map(h => {
                        if(!h.periode) return '-';
                        const [y, m] = h.periode.split('-');
                        const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
                        return `${bln[parseInt(m)-1]} ${y.substring(2)}`;
                    });

                    const dataTunggakan = sortedHistory.map(h => Number(h.sisa_pending) || 0);
                    const dataOutstanding = sortedHistory.map(h => Number(h.sisa_outstanding) || 0);
                    
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new window.Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: 'Tunggakan (Risk)', data: dataTunggakan, borderColor: '#f43f5e', backgroundColor: 'rgba(244, 63, 94, 0.2)', tension: 0.3, pointRadius: 4, borderWidth: 3, fill: true },

            const exportToCSV = (data, filename) => {
                if (data.length === 0) return;
                const headers = ["NRP", "Nama", "Site", "Prioritas Tindakan", "Tier Nominal", "Lama Tunggakan (Bulan)", "Status Tunggakan", "Target Potongan", "Berhasil Debet", "Sisa Outstanding", "Tunggakan (Pending)", "DPD", "Tingkat Risiko", "Keterangan"];
                const csvRows = [headers.join(',')];
                data.forEach(row => {
                    const values = [ 
                        `"${row.nik || ''}"`, 
                        `"${row.nama || ''}"`, 
                        `"${row.site || ''}"`, 
                        `"${row.actionPriority?.code || 'LANCAR'} - ${row.actionPriority?.name || ''}"`,
                        `"${row.exposureTier?.name || ''}"`,
                        `"${row.bulanMenunggak || 0} Bulan"`,
                        `"${row.tunggakanBadge?.text || ''}"`,
                        row.targetPotongan || 0, 
                        row.berhasilDebet || 0, 
                        row.sisaOutstanding || 0, 
                        row.sisaPending || 0, 
                        row.dpd || 0, 
                        `"${row.riskLevel?.id || ''}"`,
                        `"${(row.latestReport?.keterangan || '').replace(/"/g, '""')}"` 
                    ];
                    csvRows.push(values.join(','));
                });
                const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('hidden', ''); a.setAttribute('href', url); a.setAttribute('download', filename + '.csv');
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            };

            const fetchData = async () => {
                setIsRefreshing(true);
                try {
                    const resL = await fetch(`${GOOGLE_SHEETS_API_URL}?action=getLaporan&_t=${new Date().getTime()}`);
                    if (!resL.ok) throw new Error(`Gagal menghubungi server Google. Status: ${resL.status}`);
                    const dL = await resL.json(); 
                    
                    if (dL.status === 'error') throw new Error(dL.message);
                    
                    let currentReports = [];
                    if (dL.data && Array.isArray(dL.data) && dL.data.length > 0) currentReports = dL.data;
                    
                    setRawReports(currentReports);
                    const periods = [...new Set(currentReports.map(r => r.periode).filter(Boolean))].sort().reverse();

                let extractedMonths = 0;

                // 1. Deteksi tahun masa lalu (Mencari angka 2020 s.d 2025)
                const yearMatch = text.match(/(202[0-5])/);
                if (yearMatch) {
                    isLegacy = true;
                    insight = `Hutang Lama (${yearMatch[1]})`;
                    severity = 2; // Kritis karena lintas tahun
                    extractedMonths = 12;
                }

                // 2. Deteksi durasi bulan
                const monthMatch = text.match(/(\d+)\s*(bulan|bln)/);
                if (monthMatch) {
                    const months = parseInt(monthMatch[1]);
                    extractedMonths = Math.max(extractedMonths, months);
                    if (months >= 2) {
                        const monthText = `Nunggak ~${months} Bulan`;
                        insight = insight ? `${insight}, ${monthText}` : monthText;
                        severity = Math.max(severity, months >= 4 ? 2 : 1);
                    }
                }

                // 3. Deteksi kata kunci ekstrim
                if (text.includes('kabur') || text.includes('resign') || text.includes('phk') || text.includes('meninggal')) {
                    severity = 2;
                    insight = insight ? `${insight} [Khusus]` : `Kasus Khusus Bawaan`;
                    extractedMonths = Math.max(extractedMonths, 6);
                }

                return { isLegacy, insight, severity, extractedMonths };
            };

            const calculateRiskForPeriod = (reports, period) => {
                const memberMap = new Map();
                
                reports.forEach(rep => {
                    const nrp = rep?.nrp;
                    if(!nrp) return; 
                    if (period !== 'ALL' && rep.periode > period) return;

                    if(!memberMap.has(nrp)) {
                        memberMap.set(nrp, {
                            id: rep.id || `temp-${Math.random()}`,
                            nama: rep.nama || 'Tanpa Nama', nik: nrp, site: rep.site || '-', totalPinjamanAwal: 0, history: []
                        });
                    }
                    const member = memberMap.get(nrp);
                    member.history.push(rep);
                    
                    const repJumlah = Number(rep.jumlah) || 0;
                    if(repJumlah > member.totalPinjamanAwal) member.totalPinjamanAwal = repJumlah;
                });

                return Array.from(memberMap.values()).map(member => {
                    member.history.sort((a,b) => String(a.periode || '').localeCompare(String(b.periode || '')));
                    
                    const latest = member.history[member.history.length - 1];
                    const previous = member.history.length > 1 ? member.history[member.history.length - 2] : null;

                    const sisaOutstanding = Number(latest?.sisa_outstanding) || 0;
                    const sisaPending = Number(latest?.sisa_pending) || 0;
                    const targetPotongan = Number(latest?.total_potongan) || 0;
                    const berhasilDebet = Number(latest?.berhasil_debet) || 0;

                    let dpd = 0;
                    if (latest?.tgl_jatuh_tempo) {
                        const dueDate = new Date(latest.tgl_jatuh_tempo);
                        let actDate = null;
                        if (sisaPending === 0) {
                            if (latest.tgl_bayar) actDate = new Date(latest.tgl_bayar);
                        } else {
                            actDate = latest.tgl_bayar ? new Date(latest.tgl_bayar) : new Date();
                        }
                        
                        if (actDate) {
                            const diffTime = actDate - dueDate;
                            if(diffTime > 0) dpd = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        }
                    }

                    // Menghitung frekuensi seluruh kegagalan bayar dalam riwayat
                    const lateFreq = member.history.filter(h => {
                        const pending = Number(h?.sisa_pending) || 0;
                        const target = Number(h?.total_potongan) || 0;
                        const debet = Number(h?.berhasil_debet) || 0;
                        return pending > 0 || (target > 0 && debet < target);
                    }).length;

                    // 1. Hitung streak bulan menunggak berturut-turut hingga periode berjalan
                    let streakMenunggak = 0;
                    for (let i = member.history.length - 1; i >= 0; i--) {
                        const h = member.history[i];
                        const p = Number(h?.sisa_pending) || 0;
                        const t = Number(h?.total_potongan) || 0;
                        const d = Number(h?.berhasil_debet) || 0;
                        if (p > 0 || (t > 0 && d < t)) {
                            streakMenunggak++;
                        } else {
                            break;
                        }
                    }

                    // --- JALANKAN AI PEMINDAI KETERANGAN ---
                    const statusKet = String(latest?.keterangan || '').toLowerCase();
                    const textAnalysis = analyzeKeterangan(latest?.keterangan);

                    // 2. Hitung estimasi durasi bulan menunggak komprehensif (streak riwayat & estimasi tagihan)
                    let bulanMenunggak = 0;
                    if (sisaPending > 0) {
                        let estMonths = streakMenunggak > 0 ? streakMenunggak : 1;
                        if (targetPotongan > 0 && sisaPending > targetPotongan * 1.5) {
                            estMonths = Math.max(estMonths, Math.round(sisaPending / targetPotongan));
                        }
                        if (textAnalysis.extractedMonths > 0) {
                            estMonths = Math.max(estMonths, textAnalysis.extractedMonths);
                        }
                        bulanMenunggak = Math.max(1, estMonths);
                    }

                    // 3. Tentukan badge dan status penegasan tunggakan bulan berjalan
                    let tunggakanBadge = {
                        text: "Lancar (0 Bln)",
                        shortText: "0 Bln",
                        style: "bg-emerald-500/20 text-emerald-400 border-emerald-500/30",
                        severity: "lancar"
                    };

                    if (sisaPending > 0) {
                        if (bulanMenunggak >= 3 || dpd > 60 || textAnalysis.severity === 2) {
                            tunggakanBadge = {
                                text: `Nunggak ${bulanMenunggak} Bln (Kronis)`,
                                shortText: `${bulanMenunggak} Bln`,
                                style: "bg-rose-950/90 text-rose-300 border-rose-500/60 font-extrabold shadow-sm shadow-rose-900/50 animate-pulse",
                                severity: "critical"
                            };
                        } else if (bulanMenunggak >= 2 || dpd > 30 || textAnalysis.severity === 1) {
                            tunggakanBadge = {
                                text: `Nunggak ${bulanMenunggak} Bulan`,
                                shortText: `${bulanMenunggak} Bln`,
                                style: "bg-rose-500/20 text-rose-300 border-rose-500/40 font-bold",
                                severity: "danger"
                            };
                        } else {
                            tunggakanBadge = {
                                text: `Nunggak ${bulanMenunggak} Bln (Bulan Berjalan)`,
                                shortText: `${bulanMenunggak} Bln`,
                                style: "bg-amber-500/20 text-amber-300 border-amber-500/40 font-bold",
                                severity: "warning"
                            };
                        }
                    }

                    // 4. Hitung Tier Nominal (Exposure Tier)
                    let exposureTier = EXPOSURE_TIERS.TIER_1;
                    const expAmount = sisaPending > 0 ? sisaPending : sisaOutstanding;
                    if (expAmount >= 25000000) {
                        exposureTier = EXPOSURE_TIERS.TIER_4;
                    } else if (expAmount >= 10000000) {
                        exposureTier = EXPOSURE_TIERS.TIER_3;
                    } else if (expAmount >= 2000000) {
                        exposureTier = EXPOSURE_TIERS.TIER_2;
                    } else {
                        exposureTier = EXPOSURE_TIERS.TIER_1;
                    }

                    let warnings = [];
                    if (previous) {
                        const prevPending = Number(previous?.sisa_pending) || 0;
                        if (prevPending === 0 && sisaPending > 0) warnings.push("Mundur Potongan (Baru)");
                    }
                    if (member.totalPinjamanAwal > 0) {
                        const ratio = (sisaOutstanding / member.totalPinjamanAwal) * 100;
                        if (ratio > 80 && sisaOutstanding > 100000) warnings.push(`Debt Ratio (${ratio.toFixed(0)}%)`);
                    }
                    
                    let paymentBadgeInfo = null;
                    if (targetPotongan > 0) {
                        if (berhasilDebet === 0 && sisaPending > 0) {
                            paymentBadgeInfo = { text: "Tidak Bayar Sama Sekali", style: "bg-rose-500/20 text-rose-300 border-rose-500/30" };
                        } else if (berhasilDebet > 0 && berhasilDebet < targetPotongan) {
                            paymentBadgeInfo = { text: "Bayar Sebagian (Nyicil)", style: "bg-blue-500/20 text-blue-300 border-blue-500/30" };
                            warnings.push("🔍 AI: Indikasi Bayar Sebagian (Itikad Baik)");
                        } else if (berhasilDebet >= targetPotongan && sisaPending === 0) {
                            paymentBadgeInfo = { text: "Lunas (Meski Telat)", style: "bg-emerald-500/20 text-emerald-400 border-emerald-500/30" };
                        }
                    }

                    if (textAnalysis.insight) {
                        warnings.push(`🔍 AI: ${textAnalysis.insight}`);
                    }

                    let riskLevel = RISK_LEVELS.GREEN;
                    
                    // Logika Penentuan Risiko Terintegrasi dengan Lama Tunggakan
                    if (paymentBadgeInfo && paymentBadgeInfo.text.includes("Lunas")) {
                        riskLevel = (lateFreq >= 3 || dpd > 14) ? RISK_LEVELS.YELLOW : RISK_LEVELS.GREEN;
                    } else if (dpd > 60 || statusKet.includes('gagal total') || lateFreq >= 4 || statusKet.includes('macet') || textAnalysis.severity === 2 || bulanMenunggak >= 3) {
                        riskLevel = RISK_LEVELS.CRITICAL;
                    } else if (dpd > 30 || lateFreq >= 2 || sisaPending >= (targetPotongan * 2) || bulanMenunggak >= 2 || textAnalysis.severity === 1) {
                        riskLevel = RISK_LEVELS.RED;
                    } else if (dpd > 0 || lateFreq === 1 || sisaPending > 0) {
                        riskLevel = RISK_LEVELS.YELLOW;
                    }

                    // 5. Hitung Prioritas Tindakan 2D (Tunggakan x Tier Nominal)
                    let actionPriority = ACTION_PRIORITIES.P0;
                    if (sisaPending === 0) {
                        actionPriority = ACTION_PRIORITIES.P0;
                    } else if (bulanMenunggak >= 3 || dpd > 60 || textAnalysis.severity === 2) {
                        if (exposureTier.id === 'TIER_4' || exposureTier.id === 'TIER_3') {
                            actionPriority = ACTION_PRIORITIES.P1;
                        } else if (exposureTier.id === 'TIER_2') {
                            actionPriority = ACTION_PRIORITIES.P2;
                        } else {
                            // Tier 1 Mikro: Nunggak >= 3 bulan tapi nominal mikro < 2Jt -> P3 (Follow-up WA / simpanan offset), BEBAS SP!
                            actionPriority = ACTION_PRIORITIES.P3;
                        }
                    } else if (bulanMenunggak >= 2 || dpd > 30 || textAnalysis.severity === 1) {
                        if (exposureTier.id === 'TIER_4') {
                            actionPriority = ACTION_PRIORITIES.P1;
                        } else if (exposureTier.id === 'TIER_3') {
                            actionPriority = ACTION_PRIORITIES.P2;
                        } else if (exposureTier.id === 'TIER_2') {
                            actionPriority = ACTION_PRIORITIES.P3;
                        } else {
                            actionPriority = ACTION_PRIORITIES.P4;
                        }
                    } else {
                        // Nunggak 1 Bulan / Warning
                        if (exposureTier.id === 'TIER_4') {
                            actionPriority = ACTION_PRIORITIES.P2;
                        } else if (exposureTier.id === 'TIER_3') {
                            actionPriority = ACTION_PRIORITIES.P3;
                        } else {
                            actionPriority = ACTION_PRIORITIES.P4;
                        }
                    }

                    return {
                        ...member, 
                        latestReport: latest, 
                        sisaOutstanding, 
                        sisaPending, 
                        targetPotongan, 
                        berhasilDebet, 
                        dpd, 
                        lateFreq, 
                        streakMenunggak, 
                        bulanMenunggak, 
                        tunggakanBadge, 
                        exposureTier,
                        actionPriority,
                        warnings, 
                        riskLevel, 
                        textAnalysis, 
                        paymentBadgeInfo
                    };
                });
            };

            useEffect(() => {
                if (!rawReports || rawReports.length === 0) { setLoans([]); setRiskTrendData([]); return; }

                const chronologicalPeriods = [...availablePeriods].sort();
                const trendData = chronologicalPeriods.map(period => {
                    const members = calculateRiskForPeriod(rawReports, period);
                    const activeMembers = members.filter(m => m.latestReport?.periode === period);
                    return {
                        name: formatBulan(period), periodCode: period,
                        Green: activeMembers.filter(m => m.riskLevel.id === 'GREEN').length,
                        Yellow: activeMembers.filter(m => m.riskLevel.id === 'YELLOW').length,
                        Red: activeMembers.filter(m => m.riskLevel.id === 'RED').length,
                        Critical: activeMembers.filter(m => m.riskLevel.id === 'CRITICAL').length
                    };
                });
                setRiskTrendData(trendData);

                const processedMembers = calculateRiskForPeriod(rawReports, selectedPeriod);
                let finalLoans = processedMembers;
                if (selectedPeriod !== 'ALL') finalLoans = processedMembers.filter(m => m.latestReport?.periode === selectedPeriod);
                
                setLoans(finalLoans.sort((a,b) => {
                    const pScore = (p) => p==='P1'?5 : p==='P2'?4 : p==='P3'?3 : p==='P4'?2 : 1;
                    if(pScore(b.actionPriority.code) !== pScore(a.actionPriority.code)) return pScore(b.actionPriority.code) - pScore(a.actionPriority.code);
                    if(b.sisaPending !== a.sisaPending) return b.sisaPending - a.sisaPending;
                    return b.dpd - a.dpd;
                })); 
            }, [rawReports, selectedPeriod]);

            useEffect(() => {
                if (riskTrendData.length > 0 && chartRef.current && window.Chart) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new window.Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: riskTrendData.map(d => d.name),
                            datasets: [
                                { label: 'Lancar', data: riskTrendData.map(d => d.Green), borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.3, pointRadius: 4, borderWidth: 3 },
                                { label: 'Warning', data: riskTrendData.map(d => d.Yellow), borderColor: '#fbbf24', backgroundColor: '#fbbf24', tension: 0.3, pointRadius: 4, borderWidth: 3 },
                                { label: 'Bermasalah', data: riskTrendData.map(d => d.Red), borderColor: '#f43f5e', backgroundColor: '#f43f5e', tension: 0.3, pointRadius: 4, borderWidth: 3 },
                                { label: 'Macet', data: riskTrendData.map(d => d.Critical), borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.3, pointRadius: 4, borderWidth: 3, borderDash: [5, 5] },
                            ]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: {
                                legend: { labels: { color: 'rgba(255, 255, 255, 0.7)', font: { family: 'DM Sans', size: 10 } }, position: 'bottom' },
                                tooltip: { backgroundColor: 'rgba(15, 12, 41, 0.9)', titleColor: '#fff', bodyColor: '#fff', borderColor: 'rgba(255,255,255,0.2)', borderWidth: 1, padding: 10, cornerRadius: 8 }
                            },
                            scales: {
                                x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: 'rgba(255, 255, 255, 0.5)', font: {size: 10} } },
                                y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: 'rgba(255, 255, 255, 0.5)', stepSize: 1, font: {size: 10} } }
                            }
                        }
                    });
                }
                return () => { if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; } };
            }, [riskTrendData]);

            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('ALL');
            const [sortBy, setSortBy] = useState('PRIORITY_DESC');

            useEffect(() => { fetchData(); }, []);

            const handleAjukanKasus = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target); 
                const loanId = fd.get('loanId');
                const sel = loans.find(l => String(l.id) === String(loanId));
                if (!sel) return showToast("Pilih anggota yang valid", "warning");
                
                const p = new URLSearchParams();
                p.append('action','addWriteoff'); p.append('loanId',sel.id); p.append('nama',sel.nama); 
                p.append('nik',sel.nik); p.append('sisaHutang',sel.sisaOutstanding); p.append('alasan',fd.get('alasan'));
                
                setIsRefreshing(true);
                try { 
                    const r = await fetch(GOOGLE_SHEETS_API_URL,{method:'POST',body:p}); 
                    const res = await r.json(); 
                    if (res.status === 'success') {
                        setPengajuanModal({open:false}); showToast("Kasus berhasil diekskalasi", "success"); fetchData();
                    }
                } catch(e) { showToast("Error jaringan", "error"); } finally { setIsRefreshing(false); }
            };

            // Analisis Metrik Top Level
            const totalTargetPotongan = loans.reduce((s, l) => s + (l.targetPotongan || 0), 0);
            const totalBerhasilDebet = loans.reduce((s, l) => s + (l.berhasilDebet || 0), 0);
            const collectionRate = totalTargetPotongan > 0 ? (totalBerhasilDebet / totalTargetPotongan) * 100 : 0;

            const totalPendingDebtors = loans.filter(l => l.sisaPending > 0).length;
            const chronicDebtors = loans.filter(l => l.sisaPending > 0 && l.bulanMenunggak >= 3).length;
            const moderateDebtors = loans.filter(l => l.sisaPending > 0 && l.bulanMenunggak === 2).length;
            const newDebtors = loans.filter(l => l.sisaPending > 0 && l.bulanMenunggak === 1).length;

            const pendingLoansList = loans.filter(l => l.sisaPending > 0);
            const avgArrearsMonths = pendingLoansList.length > 0 
                ? (pendingLoansList.reduce((s, l) => s + (l.bulanMenunggak || 1), 0) / pendingLoansList.length).toFixed(1)
                : "0";

            // Metrik Prioritas Tindakan
            const p1Loans = loans.filter(l => l.actionPriority.code === 'P1');
            const p2Loans = loans.filter(l => l.actionPriority.code === 'P2');
            const p3Loans = loans.filter(l => l.actionPriority.code === 'P3');
            const p4Loans = loans.filter(l => l.actionPriority.code === 'P4');

            const p1Exposure = p1Loans.reduce((s, l) => s + l.sisaPending, 0);
            const p2Exposure = p2Loans.reduce((s, l) => s + l.sisaPending, 0);
            const spEligibleCount = p1Loans.length + p2Loans.length;
            const spProtectedCount = loans.filter(l => l.sisaPending > 0 && !l.actionPriority.canIssueSP).length;

            // Metrik Tier Nominal
            const tier1Count = loans.filter(l => l.exposureTier.id === 'TIER_1').length;
            const tier2Count = loans.filter(l => l.exposureTier.id === 'TIER_2').length;
            const tier3Count = loans.filter(l => l.exposureTier.id === 'TIER_3').length;
            const tier4Count = loans.filter(l => l.exposureTier.id === 'TIER_4').length;

            const siteRisk = {};
            loans.forEach(l => {
                const siteName = l.site || 'Unknown';
                if (!siteRisk[siteName]) siteRisk[siteName] = { count: 0, pending: 0, criticalRed: 0 };
                siteRisk[siteName].count++; siteRisk[siteName].pending += (l.sisaPending || 0);
                if (l.riskLevel.id === 'RED' || l.riskLevel.id === 'CRITICAL') siteRisk[siteName].criticalRed++;
            });
            const topRiskSites = Object.entries(siteRisk).sort((a, b) => b[1].pending - a[1].pending).slice(0, 3);

            const analytics = {
                green: loans.filter(l => l.riskLevel.id === 'GREEN' || l.sisaPending === 0).length, 
                yellow: loans.filter(l => l.riskLevel.id === 'YELLOW').length,
                red: loans.filter(l => l.riskLevel.id === 'RED').length, 
                critical: loans.filter(l => l.riskLevel.id === 'CRITICAL').length,
                totalPending: loans.reduce((s, l) => s + (l.sisaPending || 0), 0), 
                totalOutstanding: loans.reduce((s, l) => s + (l.sisaOutstanding || 0), 0),
                warningCount: loans.filter(l => l.warnings.length > 0).length, 
                totalPendingDebtors,
                chronicDebtors,
                moderateDebtors,
                newDebtors,
                avgArrearsMonths,
                collectionRate,
                topRiskSites,
                p1Count: p1Loans.length,
                p2Count: p2Loans.length,
                p3Count: p3Loans.length,
                p4Count: p4Loans.length,
                p1Exposure,
                p2Exposure,
                spEligibleCount,
                spProtectedCount,
                tier1Count,
                tier2Count,
                tier3Count,
                tier4Count
            };

            // Filter dan Pengurutan Data Debitur
            const filteredLoans = loans.filter(loan => {
                const term = searchTerm.toLowerCase().trim();
                if (term) {
                    const matchName = String(loan.nama || '').toLowerCase().includes(term);
                    const matchNik = String(loan.nik || '').toLowerCase().includes(term);
                    const matchSite = String(loan.site || '').toLowerCase().includes(term);
                    const matchKet = String(loan.latestReport?.keterangan || '').toLowerCase().includes(term);
                    if (!matchName && !matchNik && !matchSite && !matchKet) return false;
                }

                if (statusFilter === 'ALL') return true;
                // Filter Prioritas
                if (statusFilter === 'P1') return loan.actionPriority.code === 'P1';
                if (statusFilter === 'P2') return loan.actionPriority.code === 'P2';
                if (statusFilter === 'P3') return loan.actionPriority.code === 'P3';
                if (statusFilter === 'P4') return loan.actionPriority.code === 'P4';
                if (statusFilter === 'SP_ELIGIBLE') return loan.actionPriority.canIssueSP;
                if (statusFilter === 'SP_PROTECTED') return loan.sisaPending > 0 && !loan.actionPriority.canIssueSP;
                // Filter Tier
                if (statusFilter === 'TIER_1') return loan.exposureTier.id === 'TIER_1';
                if (statusFilter === 'TIER_2') return loan.exposureTier.id === 'TIER_2';
                if (statusFilter === 'TIER_3') return loan.exposureTier.id === 'TIER_3';
                if (statusFilter === 'TIER_4') return loan.exposureTier.id === 'TIER_4';
                // Filter Risiko
                if (statusFilter === 'CRITICAL') return loan.riskLevel.id === 'CRITICAL';
                if (statusFilter === 'RED') return loan.riskLevel.id === 'RED';
                if (statusFilter === 'YELLOW') return loan.riskLevel.id === 'YELLOW';
                if (statusFilter === 'GREEN') return loan.riskLevel.id === 'GREEN' || loan.sisaPending === 0;
                if (statusFilter === 'BERMASALAH') return loan.riskLevel.id === 'RED' || loan.riskLevel.id === 'CRITICAL';
                // Filter Durasi Tunggakan
                if (statusFilter === 'NUNGGAK_KRONIS') return loan.sisaPending > 0 && loan.bulanMenunggak >= 3;
                if (statusFilter === 'NUNGGAK_2_BLN') return loan.sisaPending > 0 && loan.bulanMenunggak === 2;
                if (statusFilter === 'NUNGGAK_1_BLN') return loan.sisaPending > 0 && loan.bulanMenunggak === 1;
                if (statusFilter === 'NUNGGAK_BERJALAN') return loan.sisaPending > 0;
                // Filter Kuadran Matriks Spesifik
                if (statusFilter.startsWith('QUAD_')) {
                    const parts = statusFilter.split('_');
                    const dur = parts[1];
                    const tierId = `TIER_${parts[3]}`;
                    if (dur === '3') return loan.sisaPending > 0 && loan.bulanMenunggak >= 3 && loan.exposureTier.id === tierId;
                    if (dur === '2') return loan.sisaPending > 0 && loan.bulanMenunggak === 2 && loan.exposureTier.id === tierId;
                    if (dur === '1') return loan.sisaPending > 0 && loan.bulanMenunggak === 1 && loan.exposureTier.id === tierId;
                }
            }).sort((a, b) => {
                if (sortBy === 'PRIORITY_DESC') {
                    const pScore = (p) => p==='P1'?5 : p==='P2'?4 : p==='P3'?3 : p==='P4'?2 : 1;
                    if (pScore(b.actionPriority.code) !== pScore(a.actionPriority.code)) return pScore(b.actionPriority.code) - pScore(a.actionPriority.code);
                    return b.sisaPending - a.sisaPending;
                }
                if (sortBy === 'PENDING_DESC') return b.sisaPending - a.sisaPending;
                if (sortBy === 'MONTHS_DESC') return b.bulanMenunggak - a.bulanMenunggak;
                if (sortBy === 'TIER_DESC') {
                    const tScore = (t) => t==='TIER_4'?4 : t==='TIER_3'?3 : t==='TIER_2'?2 : 1;
                    if (tScore(b.exposureTier.id) !== tScore(a.exposureTier.id)) return tScore(b.exposureTier.id) - tScore(a.exposureTier.id);
                    return b.sisaPending - a.sisaPending;
                }
                if (sortBy === 'DPD_DESC') return b.dpd - a.dpd;
                if (sortBy === 'NAME_ASC') return String(a.nama).localeCompare(String(b.nama));
                
                // Fallback: RISK_DESC
                const score = (r) => r === 'CRITICAL' ? 4 : r === 'RED' ? 3 : r === 'YELLOW' ? 2 : 1;

                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 z-50 fade-in py-10">
                                <div className="glass-panel border border-white/10 rounded-2xl shadow-2xl w-full md:max-w-4xl max-h-[90vh] flex flex-col overflow-hidden relative">
                                    <div className="px-4 py-3 border-b border-white/10 flex justify-between items-center bg-slate-900/50 sticky top-0 z-10 w-full">
                                        <div className="flex items-center gap-2">
                                            <h3 className="text-sm md:text-base font-bold text-white">Daftar Debitur:</h3>
                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${RISK_LEVELS[riskModal.level].color}`}>{riskModal.level} ({loans.filter(l => l.riskLevel.id === riskModal.level).length})</span>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => exportToCSV(loans.filter(l => l.riskLevel.id === riskModal.level), `Data_${riskModal.level}`)} className="px-3 py-1.5 rounded-xl text-[10px] font-bold bg-emerald-600 hover:bg-emerald-500 text-white flex items-center gap-1.5"><i className="fa-solid fa-download"></i> CSV</button>
                                            <button onClick={()=>setRiskModal({open:false, level:null})} className="w-7 h-7 rounded-full bg-white/5 flex items-center justify-center text-white/60 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                                        </div>
                                    </div>
                                    
                                    <div className="p-3 md:p-4 overflow-y-auto w-full">
                                        {/* Mobile Card Layout */}
                                        <div className="md:hidden flex flex-col gap-2.5 w-full">
                                            {loans.filter(l => l.riskLevel.id === riskModal.level).length === 0 && <div className="text-center p-5 text-white/40 text-xs">Tidak ada debitur pada kategori ini.</div>}
                                            {loans.filter(l => l.riskLevel.id === riskModal.level).map(l => (
                                                <div key={l.id} className="bg-white/5 border border-white/10 p-3 rounded-xl flex flex-col gap-2 text-xs w-full">
                                                    <div className="font-bold flex justify-between">
                                                        <span>{l.nama}</span>
                                                        <span className="text-rose-300">Rp {l.sisaPending.toLocaleString('id-ID')}</span>
                                                    </div>
                                                    <div className="text-[10px] text-white/60 flex items-center justify-between">
                                                        <span>{l.nik} • {l.site}</span>
                                                        <span className="font-bold text-amber-300">Nunggak: {l.bulanMenunggak} Bulan</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {/* Desktop Table Layout */}
                                        <div className="hidden md:block border border-white/10 rounded-2xl overflow-hidden w-full">
                                            <table className="w-full text-left text-xs whitespace-nowrap">
                                                <thead className="bg-black/40 text-white/50 uppercase">
                                                    <tr>
                                                        <th className="p-3">Nama / NIK</th>
                                                        <th className="p-3">Site</th>
                                                        <th className="p-3">Lama Tunggakan</th>
                                                        <th className="p-3 text-right">Tunggakan Pending</th>
                                                        <th className="p-3 text-center">DPD</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-white/10">
                                                    {loans.filter(l => l.riskLevel.id === riskModal.level).map(l => (
                                                        <tr key={l.id} className="bg-white/[0.02] hover:bg-white/5 transition-colors">
                                                            <td className="p-3 font-bold text-white">{l.nama} <span className="text-[10px] text-white/40 block font-normal">{l.nik}</span></td>
                                                            <td className="p-3 text-white/70">{l.site}</td>
                                                            <td className="p-3"><span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${l.tunggakanBadge.style}`}>{l.tunggakanBadge.text}</span></td>
                                                            <td className="p-3 text-right font-bold text-rose-300">Rp {l.sisaPending.toLocaleString('id-ID')}</td>
                                                            <td className="p-3 text-center text-white">{l.dpd > 0 ? `${l.dpd} Hr` : '-'}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {/* Modal Panduan SIPEKAT */}
                        {guideModal && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 z-50 fade-in py-10">
                                <div className="glass-panel border border-white/10 rounded-2xl shadow-2xl w-full md:max-w-3xl max-h-[90vh] flex flex-col overflow-hidden relative">
                                    <div className="px-4 py-3 border-b border-white/10 flex justify-between items-center bg-slate-900/50 sticky top-0 z-10 w-full">
                                        <h3 className="text-sm md:text-base font-bold text-white flex items-center gap-2">
                                            <i className="fa-solid fa-book-bookmark text-purple-400"></i> Panduan Lengkap Kebijakan Kredit SIPEKAT
                                        </h3>
                                        <button onClick={()=>setGuideModal(false)} className="w-7 h-7 rounded-full bg-white/5 flex items-center justify-center text-white/60 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                                    </div>
                                    
                                    <div className="p-4 md:p-6 overflow-y-auto w-full space-y-6 text-sm text-white/80">
                                        <section>
                                            <h4 className="text-purple-300 font-bold mb-2 flex items-center gap-2"><i className="fa-solid fa-shield-halved"></i> 1. Membaca Tingkat Risiko (Risk Level)</h4>
                                            <p className="mb-3 text-xs md:text-sm">Sistem mengkategorikan debitur ke dalam 4 tingkat risiko secara dinamis:</p>
                                            <div className="space-y-2 text-xs md:text-sm">
                                                <div className="flex items-start gap-3 bg-white/5 p-2.5 rounded-xl">
                                                    <span className="px-2 py-0.5 rounded text-[10px] font-bold border bg-emerald-500/20 text-emerald-400 border-emerald-500/30 shrink-0 mt-0.5">LANCAR</span>
                                                    <p>Pembayaran rutin, tidak ada tunggakan bulan berjalan, DPD (Hari Keterlambatan) &lt; 14 hari.</p>
                                                </div>
                                                <div className="flex items-start gap-3 bg-white/5 p-2.5 rounded-xl">
                                                    <span className="px-2 py-0.5 rounded text-[10px] font-bold border bg-amber-500/20 text-amber-400 border-amber-500/30 shrink-0 mt-0.5">WARNING</span>
                                                    <p>Menunggak 1 bulan tagihan (bulan berjalan), atau punya riwayat telat sesekali (DPD 1-30 hari).</p>
                                                </div>
                                                <div className="flex items-start gap-3 bg-white/5 p-2.5 rounded-xl">
                                                    <span className="px-2 py-0.5 rounded text-[10px] font-bold border bg-rose-500/20 text-rose-400 border-rose-500/30 shrink-0 mt-0.5">BERMASALAH</span>
                                                    <p>Menunggak 2 bulan tagihan, sering telat (DPD &gt; 30 hari), atau tunggakan pending mencapai 2x lipat dari angsuran bulanan normal.</p>
                                                </div>
                                                <div className="flex items-start gap-3 bg-white/5 p-2.5 rounded-xl border border-rose-500/40 bg-rose-950/30">
                                                    <span className="px-2 py-0.5 rounded text-[10px] font-bold border bg-slate-800/80 text-red-500 border-red-500/50 shrink-0 mt-0.5">KRITIS</span>
                                                    <p>Menunggak ≥ 3 bulan tagihan (kronis), gagal bayar (DPD &gt; 60 hari), riwayat kasus lama (lintas tahun), macet total, atau resign/kabur.</p>
                                                </div>
                                            </div>
                                        </section>

                                        <section>
                                            <h4 className="text-amber-300 font-bold mb-2 flex items-center gap-2"><i className="fa-solid fa-clock-rotate-left"></i> 2. Penegasan Tunggakan dari Bulan Berjalan</h4>
                                            <p className="mb-2 text-xs md:text-sm">Informasi berapa bulan tunggakan dihitung secara otomatis menggunakan 2 parameter:</p>
                                            <ul className="list-disc pl-5 space-y-1.5 text-xs md:text-sm text-white/70">
                                                <li><strong className="text-white">Rasio Tagihan Tertunggak:</strong> Total sisa pending dibagi dengan nilai angsuran bulanan (misal: Pending Rp 1.500.000 dengan angsuran Rp 500.000/bln = 3 Bulan Tagihan).</li>
                                                <li><strong className="text-white">Streak Bulan Menunggak:</strong> Riwayat kegagalan bayar berturut-turut yang terdata hingga periode saat ini.</li>
                                            </ul>
                                        </section>

                                        <section>
                                            <h4 className="text-blue-300 font-bold mb-2 flex items-center gap-2"><i className="fa-solid fa-layer-group"></i> 3. Klasifikasi Tier Nilai Tagihan (Exposure Tiers)</h4>
                                            <p className="mb-2 text-xs md:text-sm">Untuk menjamin keadilan penagihan, nilai hutang/pending dikelompokkan ke dalam 4 Tier:</p>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                                                <div className="bg-emerald-500/10 border border-emerald-500/30 p-2.5 rounded-xl">
                                                    <div className="font-bold text-emerald-300 flex justify-between">
                                                        <span>Tier 1: Mikro</span>
                                                        <span>&lt; Rp 2.000.000</span>
                                                    </div>
                                                    <p className="text-white/60 text-[11px] mt-1">Dampak risiko rendah. Diproteksi dari Surat Peringatan keras.</p>
                                                </div>
                                                <div className="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-xl">
                                                    <div className="font-bold text-amber-300 flex justify-between">
                                                        <span>Tier 2: Sedang</span>
                                                        <span>Rp 2Jt - Rp 10Jt</span>
                                                    </div>
                                                    <p className="text-white/60 text-[11px] mt-1">Dampak risiko moderat. SP-1 hanya jika menunggak kronis (≥3 bulan).</p>
                                                </div>
                                                <div className="bg-rose-500/10 border border-rose-500/30 p-2.5 rounded-xl">
                                                    <div className="font-bold text-rose-300 flex justify-between">
                                                        <span>Tier 3: Tinggi</span>
                                                        <span>Rp 10Jt - Rp 25Jt</span>
                                                    </div>
                                                    <p className="text-white/60 text-[11px] mt-1">Dampak risiko signifikan. Wajib SP-1 / SP Keras jika menunggak ≥2 bulan.</p>
                                                </div>
                                                <div className="bg-rose-950/60 border border-rose-500/50 p-2.5 rounded-xl">
                                                    <div className="font-bold text-red-300 flex justify-between">
                                                        <span>Tier 4: Kritis / Jumbo</span>
                                                        <span>&gt; Rp 25.000.000</span>
                                                    </div>
                                                    <p className="text-white/60 text-[11px] mt-1">Eksposur tinggi. Prioritas tindakan langsung eskalasi ke HR & Pengurus.</p>
                                                </div>
                                            </div>
                                        </section>

                                        <section>
                                            <h4 className="text-rose-300 font-bold mb-2 flex items-center gap-2"><i className="fa-solid fa-scale-balanced"></i> 4. SOP Prioritas Tindakan & Kebijakan Perlindungan Debitur Mikro</h4>
                                            <p className="mb-2 text-xs md:text-sm">Matriks 2 Dimensi (Lama Tunggakan $\times$ Tier Nilai) menghasilkan 4 tingkat prioritas tindakan (P1 s/d P4):</p>
                                            <div className="border border-white/10 rounded-xl overflow-hidden text-xs">
                                                <table className="w-full text-left">
                                                    <thead className="bg-white/10 text-white/70">
                                                        <tr>
                                                            <th className="p-2">Prioritas</th>
                                                            <th className="p-2">Kriteria Matriks</th>
                                                            <th className="p-2">Status SP</th>
                                                            <th className="p-2">SOP Penanganan</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-white/5">
                                                        <tr className="bg-rose-950/40">
                                                            <td className="p-2 font-extrabold text-rose-300">P1 - Darurat</td>
                                                            <td className="p-2 text-white/80">≥3 Bln (Tier 3/4) atau 2 Bln (Tier 4)</td>
                                                            <td className="p-2 font-bold text-rose-400">📜 Wajib SP Resmi</td>
                                                            <td className="p-2 text-white/70">Penerbitan SP Keras, pemanggilan langsung bersama HRD & Pengurus.</td>
                                                        </tr>
                                                        <tr className="bg-rose-500/10">
                                                            <td className="p-2 font-bold text-rose-300">P2 - Khusus</td>
                                                            <td className="p-2 text-white/80">≥3 Bln (Tier 2), 2 Bln (Tier 3), atau 1 Bln (Tier 4)</td>
                                                            <td className="p-2 font-bold text-rose-300">📜 SP-1 Diizinkan</td>
                                                            <td className="p-2 text-white/70">Penerbitan SP-1, panggilan klarifikasi dan surat komitmen bayar.</td>
                                                        </tr>
                                                        <tr className="bg-amber-500/10">
                                                            <td className="p-2 font-bold text-amber-300">P3 - Follow-up</td>
                                                            <td className="p-2 text-white/80">≥3 Bln (Tier 1 Mikro), 2 Bln (Tier 2), 1 Bln (Tier 3)</td>
                                                            <td className="p-2 font-bold text-emerald-400">🛡️ Bebas SP</td>
                                                            <td className="p-2 text-white/70">Penagihan persuasif WA/Telp atau pemotongan simpanan anggota.</td>
                                                        </tr>
                                                        <tr className="bg-blue-500/10">
                                                            <td className="p-2 font-bold text-blue-300">P4 - Notifikasi</td>
                                                            <td className="p-2 text-white/80">2 Bln (Tier 1) atau 1 Bln (Tier 1/2)</td>
                                                            <td className="p-2 font-bold text-emerald-400">🛡️ Bebas SP</td>
                                                            <td className="p-2 text-white/70">Pesan notifikasi payroll ramah sebelum cut-off periode berikutnya.</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                            <div className="bg-emerald-500/10 border border-emerald-500/30 p-2.5 rounded-xl mt-3 text-xs text-emerald-200">
                                                <i className="fa-solid fa-circle-check mr-1.5 text-emerald-400"></i>
                                                <strong>Prinsip Keadilan:</strong> Debitur Tier 1 (Mikro &lt; 2 Juta) meskipun menunggak $\ge 3$ bulan secara otomatis masuk ke kategori <strong>P3 (Bebas SP)</strong>, sehingga tidak menerima Surat Peringatan keras.
                                            </div>
                                        </section>

                                        <section>
                                            <h4 className="text-purple-300 font-bold mb-2 flex items-center gap-2"><i className="fa-solid fa-robot"></i> 5. Deteksi Pintar AI (AI Early Warning)</h4>
                                            <p className="mb-2 text-xs md:text-sm">AI otomatis memindai teks pada kolom "Keterangan" di Excel/Payroll Sheet untuk memberikan deteksi dini:</p>
                                            <ul className="list-disc pl-5 space-y-1.5 text-xs md:text-sm text-white/70">
                                                <li><strong className="text-white">Indikasi Bayar Sebagian:</strong> Jika ada cicilan masuk meski belum lunas penuh, AI mencatat sebagai itikad baik.</li>
                                                <li><strong className="text-white">Deteksi Kasus Lintas Tahun:</strong> Catatan seperti "Sisa 2023" otomatis menaikkan status menjadi Kritis.</li>
                                                <li><strong className="text-white">Kata Kunci Resiko Khusus:</strong> Kata seperti "kabur", "resign", "phk", atau "gagal total".</li>
                                            </ul>
                                        </section>

                                        <section>
                                            <h4 className="text-emerald-300 font-bold mb-2 flex items-center gap-2"><i className="fa-solid fa-file-signature"></i> 6. Ekspor & Cetak Surat Peringatan</h4>
                                            <ul className="list-disc pl-5 space-y-2 text-xs md:text-sm text-white/70">
                                                <li>Gunakan filter Prioritas Tindakan (P1, P2, P3, P4) dan Tier Nominal pada tab <strong>Pemantauan</strong> untuk mempersempit daftar kerja tim penagihan.</li>
                                                <li>Tombol <strong>Cetak Surat Peringatan (SP)</strong> hanya aktif untuk debitur yang memenuhi syarat SP (Prioritas P1 & P2).</li>
                                                <li>Gunakan tombol <strong>Export Excel/CSV</strong> untuk mengunduh laporan lengkap termasuk kolom Prioritas Tindakan dan Tier Nominal.</li>
                                            </ul>
                                        </section>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                    </main>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
