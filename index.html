<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIPEKAT Koperasi - Risk Analytics</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
        * { font-family: 'DM Sans', sans-serif; }
        body { overflow-x: hidden; } /* Mencegah geser layar ke kanan di HP */
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4,0,0.2,1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .glass-panel { background: rgba(15, 12, 41, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
        .glass-light { background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.6); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .gradient-accent { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .gradient-risk-green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .gradient-risk-yellow { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
        .gradient-risk-red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .gradient-risk-critical { background: linear-gradient(135deg, #111827 0%, #000000 100%); }
        
        .card-hover { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.15); }
        .tab-active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
        
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%); background-size: 200% 100%; animation: skeletonLoading 1.5s infinite; border-radius: 8px; }
        @keyframes skeletonLoading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="min-h-screen text-white antialiased" style="background: linear-gradient(180deg, #0f0c29 0%, #1a1a3e 40%, #24243e 100%); background-attachment: fixed;">
  <div id="root"></div>
  
  <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // URL WEB APP ANDA
        const GOOGLE_SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbynBkr_S1uZ4zbkJnJ1p9UU8rPAZ38AchBU3s9PEWZ6PoidQbXdYo-Dyh4oOH3CSDKcfg/exec';

        const RISK_LEVELS = {
            GREEN: { id: 'GREEN', label: 'Lancar', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30', icon: 'fa-shield-check' },
            YELLOW: { id: 'YELLOW', label: 'Warning', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30', icon: 'fa-triangle-exclamation' },
            RED: { id: 'RED', label: 'Bermasalah', color: 'bg-rose-500/20 text-rose-400 border-rose-500/30', icon: 'fa-fire' },
            CRITICAL: { id: 'CRITICAL', label: 'Macet/Kritis', color: 'bg-slate-800/80 text-red-500 border-red-500/50 font-bold', icon: 'fa-skull-crossbones' }
        };

        // KOMPONEN: Grafik Tren Anggota
        const MemberTrendChart = ({ history }) => {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            React.useEffect(() => {
                if (history && history.length > 0 && chartRef.current && window.Chart) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    
                    const sortedHistory = [...history].sort((a,b) => String(a.periode || '').localeCompare(String(b.periode || '')));
                    const labels = sortedHistory.map(h => {
                        if(!h.periode) return '-';
                        const [y, m] = h.periode.split('-');
                        const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
                        return `${bln[parseInt(m)-1]} ${y.substring(2)}`;
                    });

                    const dataTunggakan = sortedHistory.map(h => Number(h.sisa_pending) || 0);
                    const dataOutstanding = sortedHistory.map(h => Number(h.sisa_outstanding) || 0);
                    
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new window.Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: 'Tunggakan (Risk)', data: dataTunggakan, borderColor: '#f43f5e', backgroundColor: 'rgba(244, 63, 94, 0.2)', tension: 0.3, pointRadius: 4, borderWidth: 3, fill: true },
                                { label: 'Sisa Hutang Pokok', data: dataOutstanding, borderColor: '#3b82f6', backgroundColor: 'transparent', tension: 0.3, pointRadius: 4, borderWidth: 2, borderDash: [5, 5] }
                            ]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: {
                                legend: { labels: { color: 'rgba(255, 255, 255, 0.7)', font: { family: 'DM Sans', size: 12 } }, position: 'top' },
                                tooltip: { backgroundColor: 'rgba(15, 12, 41, 0.9)', titleColor: '#fff', bodyColor: '#fff', borderColor: 'rgba(255,255,255,0.2)', borderWidth: 1, padding: 10, cornerRadius: 8 }
                            },
                            scales: {
                                x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: 'rgba(255, 255, 255, 0.5)' } },
                                y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: 'rgba(255, 255, 255, 0.5)', callback: function(value) { if (value >= 1000000) return (value / 1000000) + ' Jt'; return value; } } }
                            }
                        }
                    });
                }
                return () => { if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; } };
            }, [history]);

            return (
                <div className="h-[200px] md:h-[250px] w-full relative">
                    <canvas ref={chartRef}></canvas>
                    {!window.Chart && <div className="absolute inset-0 flex items-center justify-center text-white/30 text-sm"><i className="fa-solid fa-spinner animate-spin mr-2"></i> Memuat grafik...</div>}
                </div>
            );
        };

        function App() {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            
            const [loans, setLoans] = useState([]);
            const [writeoffs, setWriteoffs] = useState([]);
            const [rawReports, setRawReports] = useState([]);
            const [availablePeriods, setAvailablePeriods] = useState([]);
            const [selectedPeriod, setSelectedPeriod] = useState('ALL');
            const [riskTrendData, setRiskTrendData] = useState([]);

            const [activeTab, setActiveTab] = useState('analytics');
            const [loading, setLoading] = useState(true);
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [toast, setToast] = useState({ msg: null, type: 'info' });
            const toastTimerRef = useRef(null);
            
            const [detailModal, setDetailModal] = useState({ open: false, member: null });
            const [pengajuanModal, setPengajuanModal] = useState({ open: false });
            const [riskModal, setRiskModal] = useState({ open: false, level: null });
            const [guideModal, setGuideModal] = useState(false);

            // Utils
            const formatBulan = (val) => {
                if (!val) return "-";
                try {
                    const date = new Date(val);
                    if (!isNaN(date.getTime())) return date.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
                    return val;
                } catch(e) { return val; }
            };
            
            const showToast = (msg, type = 'info') => { 
                setToast({ msg, type }); 
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = setTimeout(() => setToast({ msg: null, type: 'info' }), 4000); 
            };

            const printWarningLetter = (member) => {
                const now = new Date();
                const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                const currentMonthName = months[currentMonth];
                const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
                
                let prevMonthIndex = currentMonth - 1;
                let prevYear = currentYear;
                if (prevMonthIndex < 0) {
                    prevMonthIndex = 11;
                    prevYear--;
                }
                const prevMonthName = months[prevMonthIndex];

                const printWindow = window.open('', '_blank');
                const htmlContent = `
                    <html>
                    <head>
                        <title>Surat Peringatan - ${member.nama}</title>
                        <style>
                            body { font-family: 'Times New Roman', Times, serif; padding: 40px; color: #000; line-height: 1.5; font-size: 12pt; max-width: 800px; margin: 0 auto; background: #fff; }
                            .header { display: flex; align-items: center; border-bottom: 3px solid #000; padding-bottom: 15px; margin-bottom: 30px; }
                            .logo { width: 100px; height: auto; margin-right: 30px; }
                            .header-text { text-align: center; flex: 1; }
                            .header-text h2 { margin: 0; font-size: 18pt; font-family: Arial, sans-serif; }
                            .header-text p { margin: 3px 0; font-size: 11pt; font-family: Arial, sans-serif; }
                            .content { text-align: justify; }
                            ol { margin-top: 5px; margin-bottom: 15px; padding-left: 20px; }
                            @media print {
                                body { padding: 0; }
                                @page { margin: 2cm; }
                            }
                        </style>
                    </head>
                    <body>
                        <div class="header">
                            <img src="https://i.ibb.co.com/WvTwLMn5/image-1.png" alt="Logo" class="logo" onload="window.print();" />
                            <div class="header-text">
                                <h2>KOPERASI KARYAWAN ADARO KARYA MANDIRI</h2>
                                <p>Badan Hukum Nomor : 2128/BH/IX Tanggal 31 Juli 1995</p>
                                <p>Office : Jl. Jend. A. Yani Komp. Swadharma Jalur II Blok Mawar RT IV</p>
                                <p>Kel. Mabuun Kec. Murung Pudak Kab. Tabalong Prov. Kalimantan Selatan</p>
                                <p>Kode Pos 71571 Telp/Fax : 0526 – 2023593 email : kopkar.adaro@gmail.com</p>
                            </div>
                        </div>
                        <div class="content">
                            <p>Kepada Yth Bapak/Ibu <strong>${member.nama}</strong><br>
                            NRP: ${member.nik} | Site: ${member.site}</p>
                            
                            <p>Berdasarkan laporan payroll koperasi, pendebetan rekening Anda untuk bulan ${currentMonthName} ${currentYear} gagal karena saldo tidak mencukupi.</p>
                            
                            <p>Berikut rincian tagihan Anda:</p>
                            <ol>
                                <li>Simpanan Wajib: Rp 100.000</li>
                                <li>Simpanan Sukarela: Rp 0</li>
                                <li>Tagihan Pokok: Rp ${member.sisaOutstanding.toLocaleString('id-ID')}</li>
                                <li>Denda Administrasi: Rp 0</li>
                                <li>Total Pendingan: Rp ${member.sisaPending.toLocaleString('id-ID')}</li>
                            </ol>
                            
                            <p>Anda wajib melakukan pembayaran paling lambat tanggal <strong>${lastDay} ${currentMonthName} ${currentYear}</strong>.</p>
                            
                            <p>Berikut cara penyelesaian kewajiban Anda:</p>
                            <ol>
                                <li>Transfer tagihan Anda ke Bank Mandiri No. Rekening 0310098896775 Atas Nama Karyawan Adaro Karya.</li>
                                <li>Kirim bukti transfer ke WhatsApp admin Koperasi di nomor 082152386718.</li>
                                <li>Admin akan memverifikasi dan memperbarui status tagihan Anda menjadi lunas.</li>
                            </ol>
                            
                            <p>Keuntungan menyelesaikan tagihan tepat waktu:<br>
                            Seluruh akses layanan anggota Anda di koperasi akan segera kami buka kembali setelah Anda menyelesaikan kewajiban pembayaran.</p>
                            
                            <p>Konsekuensi jika gagal bayar melewati batas waktu:</p>
                            <ol>
                                <li>Pengenaan denda administrasi 1.5 persen per bulan dari pokok tunggakan.</li>
                                <li>Pemblokiran seluruh layanan koperasi.</li>
                                <li>Pemanggilan pertemuan formal oleh Pengurus Koperasi untuk klarifikasi.</li>
                                <li>Eskalasi resmi ke HR dan Atasan. Perusahaan dapat memberikan tindakan disiplin sesuai Pasal 58 Ayat 1 poin 21 jika masalah pinjaman ini berlarut.</li>
                            </ol>
                            
                            <p>Segera hubungi kami melalui nomor WhatsApp di atas untuk konfirmasi pembayaran atau diskusi lebih lanjut. Terima kasih atas kerja sama Anda.</p>
                            
                            <div style="margin-top: 40px;">
                                <p>Hormat kami,</p>
                                <p style="margin-top: 80px;"><strong>Pengurus Koperasi Karyawan Adaro Karya Mandiri</strong></p>
                            </div>
                        </div>
                    </body>
                    </html>
                `;
                printWindow.document.open();
                printWindow.document.write(htmlContent);
                printWindow.document.close();
            };

            const exportToCSV = (data, filename) => {
                if (data.length === 0) return;
                const headers = ["NRP", "Nama", "Site", "Target Potongan", "Berhasil Debet", "Sisa Outstanding", "Tunggakan (Pending)", "DPD", "Keterangan"];
                const csvRows = [headers.join(',')];
                data.forEach(row => {
                    const values = [ `"${row.nik || ''}"`, `"${row.nama || ''}"`, `"${row.site || ''}"`, row.targetPotongan || 0, row.berhasilDebet || 0, row.sisaOutstanding || 0, row.sisaPending || 0, row.dpd || 0, `"${row.latestReport?.keterangan || ''}"` ];
                    csvRows.push(values.join(','));
                });
                const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('hidden', ''); a.setAttribute('href', url); a.setAttribute('download', filename + '.csv');
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            };

            const fetchData = async () => {
                setIsRefreshing(true);
                try {
                    const resL = await fetch(`${GOOGLE_SHEETS_API_URL}?action=getLaporan&_t=${new Date().getTime()}`);
                    if (!resL.ok) throw new Error(`Gagal menghubungi server Google. Status: ${resL.status}`);
                    const dL = await resL.json(); 
                    
                    if (dL.status === 'error') throw new Error(dL.message);
                    
                    let currentReports = [];
                    if (dL.data && Array.isArray(dL.data) && dL.data.length > 0) currentReports = dL.data;
                    
                    setRawReports(currentReports);
                    const periods = [...new Set(currentReports.map(r => r.periode).filter(Boolean))].sort().reverse();
                    setAvailablePeriods(periods);
                    
                    const resW = await fetch(`${GOOGLE_SHEETS_API_URL}?action=getWriteoffs&_t=${new Date().getTime()}`);
                    if (resW.ok) {
                        const dW = await resW.json(); 
                        if (dW.data && Array.isArray(dW.data)) setWriteoffs(dW.data);
                    }
                } catch (e) { 
                    showToast(`Data Error: ${e.message}`, "error"); 
                } finally { 
                    setLoading(false); setIsRefreshing(false); 
                }
            };

            // AI: Fungsi Pemindai Teks Keterangan
            const analyzeKeterangan = (keterangan) => {
                if (!keterangan) return { isLegacy: false, insight: null, severity: 0 };
                const text = String(keterangan).toLowerCase();
                let insight = null;
                let isLegacy = false;
                let severity = 0; // 0: aman, 1: warning, 2: kritis

                // 1. Deteksi tahun masa lalu (Mencari angka 2020 s.d 2026)
                const yearMatch = text.match(/(202[0-6])/);
                if (yearMatch) {
                    isLegacy = true;
                    insight = `Hutang Lama (${yearMatch[1]})`;
                    severity = 2; // Kritis karena lintas tahun
                }

                // 2. Deteksi durasi bulan
                const monthMatch = text.match(/(\d+)\s*(bulan|bln)/);
                if (monthMatch) {
                    const months = parseInt(monthMatch[1]);
                    if (months >= 2) {
                        const monthText = `Nunggak ~${months} Bulan`;
                        insight = insight ? `${insight}, ${monthText}` : monthText;
                        severity = Math.max(severity, months >= 4 ? 2 : 1);
                    }
                }

                // 3. Deteksi kata kunci ekstrim
                if (text.includes('kabur') || text.includes('resign') || text.includes('phk') || text.includes('meninggal')) {
                    severity = 2;
                    insight = insight ? `${insight} [Khusus]` : `Kasus Khusus Bawaan`;
                }

                return { isLegacy, insight, severity };
            };

            const calculateRiskForPeriod = (reports, period) => {
                const memberMap = new Map();
                
                reports.forEach(rep => {
                    const nrp = rep?.nrp;
                    if(!nrp) return; 
                    if (period !== 'ALL' && rep.periode > period) return;

                    if(!memberMap.has(nrp)) {
                        memberMap.set(nrp, {
                            id: rep.id || `temp-${Math.random()}`,
                            nama: rep.nama || 'Tanpa Nama', nik: nrp, site: rep.site || '-', totalPinjamanAwal: 0, history: []
                        });
                    }
                    const member = memberMap.get(nrp);
                    member.history.push(rep);
                    
                    const repJumlah = Number(rep.jumlah) || 0;
                    if(repJumlah > member.totalPinjamanAwal) member.totalPinjamanAwal = repJumlah;
                });

                return Array.from(memberMap.values()).map(member => {
                    member.history.sort((a,b) => String(a.periode || '').localeCompare(String(b.periode || '')));
                    
                    const latest = member.history[member.history.length - 1];
                    const previous = member.history.length > 1 ? member.history[member.history.length - 2] : null;

                    const sisaOutstanding = Number(latest?.sisa_outstanding) || 0;
                    const sisaPending = Number(latest?.sisa_pending) || 0;
                    const targetPotongan = Number(latest?.total_potongan) || 0;
                    const berhasilDebet = Number(latest?.berhasil_debet) || 0;

                    let dpd = 0;
                    if (sisaPending > 0 && latest?.tgl_jatuh_tempo) {
                        const dueDate = new Date(latest.tgl_jatuh_tempo);
                        const actDate = latest.tgl_bayar ? new Date(latest.tgl_bayar) : new Date(); 
                        const diffTime = actDate - dueDate;
                        if(diffTime > 0) dpd = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    }

                    const lateFreq = member.history.filter(h => {
                        const pending = Number(h?.sisa_pending) || 0;
                        const target = Number(h?.total_potongan) || 0;
                        const debet = Number(h?.berhasil_debet) || 0;
                        return pending > 0 || (target > 0 && debet < target);
                    }).length;

                    let warnings = [];
                    if (previous) {
                        const prevPending = Number(previous?.sisa_pending) || 0;
                        if (prevPending === 0 && sisaPending > 0) warnings.push("Mundur Potongan (Baru)");
                    }
                    if (member.totalPinjamanAwal > 0) {
                        const ratio = (sisaOutstanding / member.totalPinjamanAwal) * 100;
                        if (ratio > 80 && sisaOutstanding > 100000) warnings.push(`Debt Ratio (${ratio.toFixed(0)}%)`);
                    }
                    if(targetPotongan > 0 && berhasilDebet > 0 && berhasilDebet < targetPotongan && lateFreq > 1){
                         warnings.push("Bayar Parsial");
                    }

                    // --- JALANKAN AI PEMINDAI KETERANGAN ---
                    const statusKet = String(latest?.keterangan || '').toLowerCase();
                    const textAnalysis = analyzeKeterangan(latest?.keterangan);
                    
                    if (textAnalysis.insight) {
                        warnings.push(`🔍 AI: ${textAnalysis.insight}`);
                    }

                    let riskLevel = RISK_LEVELS.GREEN;
                    
                    // Logika Penentuan Risiko
                    if (dpd > 60 || statusKet.includes('gagal total') || lateFreq >= 4 || statusKet.includes('macet') || textAnalysis.severity === 2) {
                        riskLevel = RISK_LEVELS.CRITICAL; // Jika Kasus Lama (Severity 2), paksa jadi Kritis
                    } else if (dpd > 30 || lateFreq >= 2 || sisaPending >= (targetPotongan * 2) || textAnalysis.severity === 1) {
                        riskLevel = RISK_LEVELS.RED;
                    } else if (dpd > 0 || lateFreq === 1 || sisaPending > 0) {
                        riskLevel = RISK_LEVELS.YELLOW;
                    }

                    return {
                        ...member, latestReport: latest, sisaOutstanding, sisaPending, targetPotongan, berhasilDebet, dpd, lateFreq, warnings, riskLevel, textAnalysis
                    };
                });
            };

            useEffect(() => {
                if (!rawReports || rawReports.length === 0) { setLoans([]); setRiskTrendData([]); return; }

                const chronologicalPeriods = [...availablePeriods].sort();
                const trendData = chronologicalPeriods.map(period => {
                    const members = calculateRiskForPeriod(rawReports, period);
                    const activeMembers = members.filter(m => m.latestReport?.periode === period);
                    return {
                        name: formatBulan(period), periodCode: period,
                        Green: activeMembers.filter(m => m.riskLevel.id === 'GREEN').length,
                        Yellow: activeMembers.filter(m => m.riskLevel.id === 'YELLOW').length,
                        Red: activeMembers.filter(m => m.riskLevel.id === 'RED').length,
                        Critical: activeMembers.filter(m => m.riskLevel.id === 'CRITICAL').length
                    };
                });
                setRiskTrendData(trendData);

                const processedMembers = calculateRiskForPeriod(rawReports, selectedPeriod);
                let finalLoans = processedMembers;
                if (selectedPeriod !== 'ALL') finalLoans = processedMembers.filter(m => m.latestReport?.periode === selectedPeriod);
                
                setLoans(finalLoans.sort((a,b) => {
                    const score = (r) => r==='CRITICAL'?4:r==='RED'?3:r==='YELLOW'?2:1;
                    if(score(b.riskLevel.id) !== score(a.riskLevel.id)) return score(b.riskLevel.id) - score(a.riskLevel.id);
                    return b.dpd - a.dpd;
                })); 
            }, [rawReports, selectedPeriod]);

            useEffect(() => {
                if (riskTrendData.length > 0 && chartRef.current && window.Chart) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new window.Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: riskTrendData.map(d => d.name),
                            datasets: [
                                { label: 'Lancar', data: riskTrendData.map(d => d.Green), borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.3, pointRadius: 4, borderWidth: 3 },
                                { label: 'Warning', data: riskTrendData.map(d => d.Yellow), borderColor: '#fbbf24', backgroundColor: '#fbbf24', tension: 0.3, pointRadius: 4, borderWidth: 3 },
                                { label: 'Bermasalah', data: riskTrendData.map(d => d.Red), borderColor: '#f43f5e', backgroundColor: '#f43f5e', tension: 0.3, pointRadius: 4, borderWidth: 3 },
                                { label: 'Macet', data: riskTrendData.map(d => d.Critical), borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.3, pointRadius: 4, borderWidth: 3, borderDash: [5, 5] },
                            ]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: {
                                legend: { labels: { color: 'rgba(255, 255, 255, 0.7)', font: { family: 'DM Sans', size: 10 } }, position: 'bottom' },
                                tooltip: { backgroundColor: 'rgba(15, 12, 41, 0.9)', titleColor: '#fff', bodyColor: '#fff', borderColor: 'rgba(255,255,255,0.2)', borderWidth: 1, padding: 10, cornerRadius: 8 }
                            },
                            scales: {
                                x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: 'rgba(255, 255, 255, 0.5)', font: {size: 10} } },
                                y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: 'rgba(255, 255, 255, 0.5)', stepSize: 1, font: {size: 10} } }
                            }
                        }
                    });
                }
                return () => { if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; } };

            const handleAjukanKasus = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target); 
                const loanId = fd.get('loanId');
                const sel = loans.find(l => String(l.id) === String(loanId));
                if (!sel) return showToast("Pilih anggota yang valid", "warning");
                
                const p = new URLSearchParams();
                p.append('action','addWriteoff'); p.append('loanId',sel.id); p.append('nama',sel.nama); 
                p.append('nik',sel.nik); p.append('sisaHutang',sel.sisaOutstanding); p.append('alasan',fd.get('alasan'));
                
                setIsRefreshing(true);
                try { 
                    const r = await fetch(GOOGLE_SHEETS_API_URL,{method:'POST',body:p}); 
                    const res = await r.json(); 
                    if (res.status === 'success') {
                        setPengajuanModal({open:false}); showToast("Kasus berhasil diekskalasi", "success"); fetchData();
                    }
                } catch(e) { showToast("Error jaringan", "error"); } finally { setIsRefreshing(false); }
            };

            // Analisis Metrik Top Level
            const totalTargetPotongan = loans.reduce((s, l) => s + (l.targetPotongan || 0), 0);
            const totalBerhasilDebet = loans.reduce((s, l) => s + (l.berhasilDebet || 0), 0);

                if (l.riskLevel.id === 'RED' || l.riskLevel.id === 'CRITICAL') siteRisk[siteName].criticalRed++;
            });
            const topRiskSites = Object.entries(siteRisk).sort((a, b) => b[1].pending - a[1].pending).slice(0, 3);

                red: loans.filter(l => l.riskLevel.id === 'RED').length, critical: loans.filter(l => l.riskLevel.id === 'CRITICAL').length,
                totalPending: loans.reduce((s, l) => s + (l.sisaPending || 0), 0), totalOutstanding: loans.reduce((s, l) => s + (l.sisaOutstanding || 0), 0),
                warningCount: loans.filter(l => l.warnings.length > 0).length, topRiskSites
            };

            if (loading) {

                                        <div>
                                            <h3 className="text-base font-bold text-white">{detailModal.member.nama}</h3>
                                            <div className="text-[10px] text-white/50">{detailModal.member.nik} | Rp {detailModal.member.sisaOutstanding.toLocaleString('id-ID')}</div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            {detailModal.member.riskLevel.id === 'CRITICAL' && (
                                                <button onClick={() => printWarningLetter(detailModal.member)} className="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-lg flex items-center gap-2">
                                                    <i className="fa-solid fa-print"></i> <span className="hidden sm:inline">Surat Peringatan</span>
                                                </button>
                                            )}
                                            <button onClick={()=>setDetailModal({open:false, member:null})} className="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-white/60"><i className="fa-solid fa-xmark"></i></button>
                                        </div>
                                    </div>
                                    
                                    <div className="p-4 overflow-y-auto w-full">
                                        {/* BANNER AI KASUS LAMA */}
                                        {detailModal.member.textAnalysis?.isLegacy && (
                                            <div className="mb-4 bg-purple-500/10 border border-purple-500/30 p-3 rounded-xl flex items-start gap-3 w-full">
                                                <div className="w-8 h-8 rounded-full bg-purple-500/20 text-purple-400 flex items-center justify-center shrink-0 mt-0.5"><i className="fa-solid fa-clock-rotate-left"></i></div>
                                                <div className="min-w-0">
                                                    <h4 className="text-purple-300 font-bold text-sm">Peringatan AI: Kasus Lama</h4>
                                                    <p className="text-purple-200/70 text-[10px] md:text-xs mt-1">Sistem mendeteksi riwayat hutang ini berasal dari tahun sebelumnya berdasarkan catatan keterangan. Status risiko dipaksa menjadi Kritis.</p>
                                                </div>
                                            </div>
                                        )}
                                        
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-4 mb-4">
                                            <div className="bg-white/5 p-3 rounded-xl text-center"><div className="text-white/40 text-[9px] uppercase mb-1">Risiko</div><div className="text-sm md:text-lg font-black text-rose-400">{detailModal.member.riskLevel.id}</div></div>
                                            <div className="bg-white/5 p-3 rounded-xl text-center"><div className="text-white/40 text-[9px] uppercase mb-1">Telat (DPD)</div><div className="text-sm md:text-lg font-black text-white">{detailModal.member.dpd} Hr</div></div>
                                            <div className="bg-white/5 p-3 rounded-xl text-center"><div className="text-white/40 text-[9px] uppercase mb-1">Freq Telat</div><div className="text-sm md:text-lg font-black text-white">{detailModal.member.lateFreq}x</div></div>
                                            <div className="bg-white/5 p-3 rounded-xl text-center"><div className="text-white/40 text-[9px] uppercase mb-1">Max Pinjam</div><div className="text-sm md:text-lg font-black text-white/80">{(detailModal.member.totalPinjamanAwal/1000000).toFixed(1)}Jt</div></div>
                                        </div>

                                        <div className="mb-4 bg-black/20 border border-white/10 p-3 rounded-xl w-full overflow-hidden">
                                            <h4 className="font-bold text-white/70 mb-2 text-[10px] uppercase border-l-2 border-emerald-500 pl-2">Tren Tunggakan</h4>
                                            <MemberTrendChart history={detailModal.member.history} />
                                        </div>

                                        <h4 className="font-bold text-white/70 mb-2 text-[10px] uppercase border-l-2 border-purple-500 pl-2">Timeline</h4>
                                        
                                        {/* Mobile Card Layout for Timeline */}
                                        <div className="md:hidden flex flex-col gap-2 w-full">
                                            {[...detailModal.member.history].reverse().map((h, i) => {
                                                const p = Number(h?.sisa_pending) || 0; const t = Number(h?.total_potongan) || 0; const d = Number(h?.berhasil_debet) || 0;
                                                return (
                                                    <div key={i} className="bg-white/5 p-3 rounded-xl text-xs w-full">
                                                        <div className="flex justify-between font-bold mb-2"><span>{formatBulan(h?.periode)}</span><span className={p>0?'text-rose-400':'text-emerald-400'}>Pending: Rp {p.toLocaleString('id-ID')}</span></div>
                                                        <div className="flex justify-between text-[10px] text-white/60 mb-2"><span>Target: {t.toLocaleString()}</span><span>Debet: {d.toLocaleString()}</span></div>
                                                        <div className="bg-black/20 p-2 rounded text-[10px] italic">{h?.keterangan || '-'}</div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                        
                                        {/* Desktop Table Layout for Timeline */}
                                        <div className="hidden md:block border border-white/10 rounded-xl overflow-x-auto w-full">
                                            <table className="w-full text-left text-xs whitespace-nowrap">
                                                <thead className="bg-black/40 text-white/50 uppercase"><tr><th className="p-3">Bulan</th><th className="p-3 text-right">Target</th><th className="p-3 text-right">Debet</th><th className="p-3 text-right">Tunggakan</th><th className="p-3">Keterangan</th></tr></thead>
                                                <tbody className="divide-y divide-white/10">
                                                    {[...detailModal.member.history].reverse().map((h, i) => (
                                                        <tr key={i} className="bg-white/[0.02]">
                                                            <td className="p-3 font-bold">{formatBulan(h?.periode)}</td><td className="p-3 text-right text-white/70">{Number(h?.total_potongan||0).toLocaleString()}</td>
                                                            <td className="p-3 text-right font-bold text-emerald-300">{Number(h?.berhasil_debet||0).toLocaleString()}</td>
                                                            <td className="p-3 text-right font-bold text-rose-400">{Number(h?.sisa_pending||0).toLocaleString()}</td>
                                                            <td className="p-3 text-[10px] whitespace-normal max-w-[200px] italic">{h?.keterangan || '-'}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Modal Eskalasi */}
                        {pengajuanModal.open && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
                                <div className="glass-panel border border-white/10 rounded-xl p-5 w-full md:max-w-md">
                                    <h3 className="text-lg font-bold text-white mb-4">Eskalasi Kasus</h3>
                                    <form onSubmit={handleAjukanKasus}>
                                        <div className="mb-4">
                                            <label className="block text-[10px] font-bold text-white/50 mb-1">Pilih Debitur (Red/Critical)</label>
                                            <select name="loanId" required className="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-sm text-white">
                                                <option value="" className="bg-slate-900">-- Pilih --</option>
                                                {loans.filter(l=>l.riskLevel.id==='CRITICAL' || l.riskLevel.id==='RED').map(l=><option key={l.id} value={l.id} className="bg-slate-900">{l.nama}</option>)}
                                            </select>
                                        </div>
                                        <div className="mb-5">
                                            <label className="block text-[10px] font-bold text-white/50 mb-1">Alasan</label>
                                            <select name="alasan" required className="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-sm text-white">
                                                <option value="" className="bg-slate-900">-- Pilih --</option>
                                                <option value="Macet Total > 3 Bulan" className="bg-slate-900">Macet Total &gt; 3 Bulan</option>
                                                <option value="PHK Menunggak" className="bg-slate-900">Resign / PHK</option>
                                            </select>
                                        </div>
                                        <div className="flex gap-2 justify-end">
                                            <button type="button" onClick={()=>setPengajuanModal({open:false})} className="px-4 py-2 text-xs font-bold text-white/50">Batal</button>
                                            <button type="submit" className="px-4 py-2 bg-rose-600 text-white rounded-lg text-xs font-bold">Simpan</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Modal List Debitur per Risiko (Responsive Card/Table) */}
                        {riskModal.open && riskModal.level && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 z-50 fade-in py-10">
                                <div className="glass-panel border border-white/10 rounded-xl shadow-2xl w-full md:max-w-4xl max-h-[90vh] flex flex-col overflow-hidden relative">
                                    <div className="px-4 py-3 border-b border-white/10 flex justify-between items-center bg-slate-900/50 sticky top-0 z-10 w-full">
                                        <div className="flex items-center gap-2">
                                            <h3 className="text-sm md:text-base font-bold text-white">Debitur:</h3>
                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${RISK_LEVELS[riskModal.level].color}`}>{riskModal.level}</span>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => exportToCSV(loans.filter(l => l.riskLevel.id === riskModal.level), `Data_${riskModal.level}`)} className="px-3 py-1.5 rounded-lg text-[10px] font-bold bg-emerald-600 text-white"><i className="fa-solid fa-download"></i> CSV</button>
                                            <button onClick={()=>setRiskModal({open:false, level:null})} className="w-7 h-7 rounded-full bg-white/5 flex items-center justify-center text-white/60"><i className="fa-solid fa-xmark"></i></button>
                                        </div>
                                    </div>
                                    
                                    <div className="p-3 md:p-4 overflow-y-auto w-full">
                                        {/* Mobile Card Layout */}
                                        <div className="md:hidden flex flex-col gap-2 w-full">
                                            {loans.filter(l => l.riskLevel.id === riskModal.level).length === 0 && <div className="text-center p-5 text-white/40 text-xs">Kosong</div>}
                                            {loans.filter(l => l.riskLevel.id === riskModal.level).map(l => (
                                                <div key={l.id} className="bg-white/5 p-3 rounded-xl flex flex-col gap-2 text-xs w-full">
                                                    <div className="font-bold flex justify-between"><span>{l.nama}</span><span className="text-rose-400">Rp {l.sisaPending.toLocaleString()}</span></div>
                                                    <div className="text-[10px] text-white/50">{l.nik} • {l.site} • DPD: {l.dpd}Hr</div>
                                                </div>
                                            ))}
                                        </div>

                                        {/* Desktop Table Layout */}
                                        <div className="hidden md:block border border-white/10 rounded-xl overflow-x-auto w-full">
                                            <table className="w-full text-left text-xs whitespace-nowrap">
                                                <thead className="bg-black/40 text-white/50 uppercase"><tr><th className="p-3">Nama / NIK</th><th className="p-3">Site</th><th className="p-3 text-right">Tunggakan</th><th className="p-3 text-center">DPD</th></tr></thead>
                                                <tbody className="divide-y divide-white/10">
                                                    {loans.filter(l => l.riskLevel.id === riskModal.level).map(l => (
                                                        <tr key={l.id} className="bg-white/[0.02]">
                                                            <td className="p-3 font-bold">{l.nama} <span className="text-[10px] text-white/40 block font-normal">{l.nik}</span></td>
                                                            <td className="p-3 text-white/70">{l.site}</td>
                                                            <td className="p-3 text-right font-bold text-rose-400">Rp {l.sisaPending.toLocaleString('id-ID')}</td>
                                                            <td className="p-3 text-center">{l.dpd > 0 ? `${l.dpd} Hr` : '-'}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                    </main>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
